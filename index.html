<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overload">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Overload</title>
<script>try{var t=(JSON.parse(localStorage.getItem('ironbook.v1')||'{}').settings||{}).theme;if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.32,.72,0,1);--gold:#ffc83d;--ok:#3ddc84;--bad:#ff5a5f;--r:14px}
/* themes — Glacier is the default */
:root,[data-theme=glacier]{--bg:#0a0f15;--card:#111821;--card2:#19222d;--line:#243040;--txt:#e8eef5;--mut:#8593a6;--acc:#38bdf8;--acc-rgb:56,189,248;--on-acc:#03131d;--hdr:rgba(10,15,21,.9);--nav:rgba(13,19,27,.96);--raised:#1c2633;--grab:#344255;--press:rgba(255,255,255,.04);color-scheme:dark}
[data-theme=violet]{--bg:#0e0c15;--card:#16131f;--card2:#1f1b2b;--line:#2c2740;--txt:#ece9f5;--mut:#928ca8;--acc:#a78bfa;--acc-rgb:167,139,250;--on-acc:#170d30;--hdr:rgba(14,12,21,.9);--nav:rgba(18,15,27,.96);--raised:#231e31;--grab:#3d3654;--press:rgba(255,255,255,.04);color-scheme:dark}
[data-theme=crimson]{--bg:#100b0c;--card:#191314;--card2:#231b1d;--line:#33272a;--txt:#f3eaeb;--mut:#a08f92;--acc:#fb4d6a;--acc-rgb:251,77,106;--on-acc:#2b0510;--hdr:rgba(16,11,12,.9);--nav:rgba(22,15,17,.96);--raised:#2a1f22;--grab:#4a3a3e;--press:rgba(255,255,255,.04);color-scheme:dark}
[data-theme=ember]{--bg:#0e0f12;--card:#17191f;--card2:#20232b;--line:#2a2e38;--txt:#e9ebf0;--mut:#8b90a0;--acc:#ff7a1a;--acc-rgb:255,122,26;--on-acc:#1a0d00;--hdr:rgba(14,15,18,.92);--nav:rgba(18,19,24,.96);--raised:#22252e;--grab:#3a3f4b;--press:rgba(255,255,255,.04);color-scheme:dark}
[data-theme=daylight]{--bg:#f3f4f7;--card:#ffffff;--card2:#eef0f4;--line:#dfe3ea;--txt:#12161c;--mut:#69717f;--acc:#2563eb;--acc-rgb:37,99,235;--on-acc:#ffffff;--hdr:rgba(243,244,247,.88);--nav:rgba(255,255,255,.94);--raised:#ffffff;--grab:#c9ced8;--press:rgba(0,0,0,.04);--gold:#d89b00;--ok:#16a34a;color-scheme:light}
html.theming,html.theming *{transition:background-color .45s var(--ease),color .45s var(--ease),border-color .45s var(--ease),fill .45s var(--ease),stroke .45s var(--ease)!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
button,input,select{font-family:inherit;color:inherit}
header#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--hdr);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0;letter-spacing:.3px}h1 b{color:var(--acc)}
h2{font-size:18px;margin:0 0 6px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:18px 2px 8px;font-weight:700}
.sec.gold{color:var(--gold)}
main{padding:14px 14px calc(150px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;touch-action:pan-y}
#peek{position:fixed;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:1;display:none;will-change:transform}
#peek .peekin{max-width:720px;margin:0 auto;padding:14px}
main.swiping{will-change:transform}
nav#tabs{position:fixed;isolation:isolate;bottom:0;left:0;right:0;display:flex;background:var(--nav);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav#tabs button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav#tabs button.on{color:var(--acc)}
#tabind{position:absolute;top:5px;left:0;width:25%;height:46px;z-index:-1;transition:transform .5s var(--spring);pointer-events:none}
#tabind::after{content:'';position:absolute;inset:0 18%;border-radius:14px;background:rgba(var(--acc-rgb),.12)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.btn{appearance:none;border:0;border-radius:11px;padding:12px 16px;font-size:15px;font-weight:600;background:var(--card2);cursor:pointer;text-align:center;display:inline-block}
.btn.primary{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%;display:block}
.btn.sm{padding:9px 12px;font-size:14px}
.btn.add{margin-top:4px;border:1px dashed var(--line);background:transparent;color:var(--acc)}
.row{display:flex;align-items:center}.gap{gap:8px}.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.center{text-align:center}
.hero h2{font-size:22px}.hero p{margin:4px 0 14px}
.rowcard{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;cursor:pointer}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--mut);font-weight:600;white-space:nowrap}
.badge.gold{background:rgba(255,200,61,.15);color:var(--gold)}
/* active workout */
.active-head .wname{width:100%;background:transparent;border:0;font-size:20px;font-weight:700;padding:0;outline:none}
.active-head .meta{display:flex;align-items:center;gap:8px;margin:6px 0 12px;color:var(--mut);font-size:13px;flex-wrap:wrap}
.active-head input[type=datetime-local]{background:var(--card2);border:0;border-radius:8px;padding:5px 8px;font-size:13px;color:var(--mut)}
.active-head .dur input{width:64px;background:var(--card2);border:0;border-radius:8px;padding:5px 8px;font-size:16px;text-align:center}
.active-head .row .btn{flex:1}
#elapsed{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:700}
.ehead{display:flex;justify-content:space-between;align-items:center}
.ename{background:none;border:0;padding:0;font-size:16px;font-weight:700;color:var(--acc);text-align:left;cursor:pointer}
.sethead,.set{display:grid;grid-template-columns:34px 1fr 78px 64px 44px;gap:6px;align-items:center}
.sethead{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 4px;text-align:center}
.sethead span:nth-child(2){text-align:left;padding-left:4px}
.set{position:relative;padding:4px 2px;border-radius:10px;margin-bottom:2px}
.set.done{background:rgba(61,220,132,.10)}
.set input{width:100%;background:var(--card2);border:1px solid transparent;border-radius:8px;font-size:16px;padding:9px 4px;text-align:center;outline:none;-moz-appearance:textfield}
.set input:focus{border-color:var(--acc)}
.set input::-webkit-outer-spin-button,.set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set.done input{background:transparent}
.sn{height:36px;border:0;border-radius:8px;background:transparent;font-weight:700;cursor:pointer}
.set.warm .sn{color:var(--gold)}
.prev{background:none;border:0;color:var(--mut);font-size:13px;text-align:left;padding:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{height:38px;border-radius:9px;border:0;background:var(--card2);color:var(--mut);font-size:18px;font-weight:800;cursor:pointer}
.set.done .chk{background:var(--ok);color:#06210f}
.prtag{position:absolute;left:-6px;top:-5px;background:var(--gold);color:#2a1d00;font-size:9px;font-weight:800;padding:1px 4px;border-radius:5px;z-index:1}
.prtag:empty{display:none}
/* rest bar */
#restbar{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto;background:var(--raised);border:1px solid var(--line);border-radius:14px;overflow:hidden;z-index:7;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#restbar{z-index:16}
body.focusing #restbar{bottom:calc(14px + env(safe-area-inset-bottom))}
#restbar{transform:translateY(calc(100% + 100px));opacity:0;pointer-events:none;transition:transform .55s var(--spring),opacity .35s var(--ease)}
#restbar.show{transform:none;opacity:1;pointer-events:auto}
#restbar .fill{position:absolute;inset:0;background:rgba(var(--acc-rgb),.18);transform:scaleX(0);transform-origin:left;transition:transform .25s linear,background-color .4s}
#restbar.fin .fill{background:rgba(61,220,132,.25)}
.rb-in{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px}
.rb-in b{font-size:20px;font-variant-numeric:tabular-nums;flex:1}
.rb-btns{display:flex;gap:6px}
.rb-btns button{background:var(--card2);border:0;border-radius:8px;padding:8px 10px;font-weight:600;cursor:pointer}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);overscroll-behavior:contain;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{position:relative;will-change:transform;background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:26px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.grab{position:absolute;top:0;left:0;right:0;height:26px;touch-action:none;cursor:grab}
.grab::after{content:'';position:absolute;left:50%;top:9px;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--grab)}
.search{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
.search:focus{border-color:var(--acc)}
.list{display:flex;flex-direction:column}
.card.list{padding:4px 0}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;text-align:left;cursor:pointer;width:100%}
.li:last-child{border-bottom:0}
.li.create{color:var(--acc);font-weight:600}
.fl{display:block;font-size:13px;color:var(--mut);margin:12px 0 0}
.fl input,.fl select{display:block;width:100%;margin-top:6px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--txt);outline:none}
select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:600;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.filebtn{position:relative}
.tog{display:flex;align-items:center;gap:6px;margin:10px 2px 0}
/* history */
.whead{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.wsum{margin-top:8px}
.wbody{margin-top:12px}
.went{padding:8px 0;border-top:1px solid var(--line)}
.wname2{font-weight:600;color:var(--acc);cursor:pointer;margin-bottom:4px}
.wsets{display:flex;flex-wrap:wrap;gap:6px}
.ws{font-size:13px;background:var(--card2);padding:4px 8px;border-radius:7px;font-variant-numeric:tabular-nums}
.ws.warm{color:var(--gold)}
.ws.pr{background:rgba(255,200,61,.15);color:var(--gold)}
.wbody .row{margin-top:12px;flex-wrap:wrap}
/* progress */
.exsel{width:100%;font-weight:600;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.chips.range{justify-content:center;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.stats.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:480px){.stats.four{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card2);border-radius:11px;padding:10px}
.stat .k{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.down{color:var(--bad)}
.chartwrap{position:relative;margin-top:4px}
svg#chart{width:100%;height:auto;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#chart .grid{stroke:var(--line);stroke-width:1}
#chart .ax{fill:var(--mut);font-size:17px}
#chart .ln{fill:none;stroke:var(--acc);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
#chart .dot{fill:var(--bg);stroke:var(--acc);stroke-width:2.5}
#chart .dot.pr{fill:var(--gold);stroke:var(--gold)}
#chart .xh{stroke:var(--mut);stroke-dasharray:4 4}
#chart .hl{fill:none;stroke:var(--txt);stroke-width:2}
.tip{position:absolute;top:2px;transform:translateX(-50%);background:var(--raised);box-shadow:0 6px 20px rgba(0,0,0,.25);border:1px solid var(--line);padding:5px 9px;border-radius:8px;font-size:12px;pointer-events:none;white-space:nowrap;text-align:center;z-index:2}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:600;font-size:12px;text-align:left;padding:6px 8px}
td{padding:8px}
tbody tr:nth-child(odd) td{background:var(--card2)}
.num{text-align:right}
.empty{text-align:center;padding:30px 16px}
.empty-sm{text-align:center;padding:40px 0}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--raised);box-shadow:0 8px 24px rgba(0,0,0,.25);border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast{transition:opacity .3s var(--ease),transform .5s var(--spring)}
/* motion */
.btn,.chk,.chip,.sn,.prev,.icon,.ename,.seg button,nav#tabs button,.rb-btns button{transition:transform .18s var(--ease),background-color .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease),opacity .2s}
.btn:active,.chk:active,.chip:active,.icon:active,.seg button:active,.rb-btns button:active{transform:scale(.95)}
.sn:active,.prev:active,.ename:active{opacity:.6}
.li,.rowcard,.whead{transition:background-color .2s var(--ease),transform .18s var(--ease)}
.li:active{background:var(--press)}
.rowcard:active{transform:scale(.985)}
nav#tabs button:active svg{transform:scale(.85)}
nav#tabs svg{transition:transform .25s var(--spring)}
.set{transition:background-color .35s var(--ease)}
.set input{transition:background-color .3s var(--ease),border-color .2s var(--ease)}
#chart .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s var(--ease) .05s forwards}
#chart .area{opacity:0;animation:fade .9s var(--ease) .3s forwards}
#chart .dot{transform-box:fill-box;transform-origin:center;animation:pop .45s var(--ease) both;animation-delay:var(--d,0s)}
#chart .xh,#chart .hl{transition:transform .16s var(--ease),opacity .2s;opacity:0}
#chart.hover .xh,#chart.hover .hl{opacity:1}
.tip{transition:left .16s var(--ease),opacity .2s;opacity:0}
.tip.on{opacity:1}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer;padding:0}
.sw span{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--s1) 52%,var(--s2) 52%);border:2px solid var(--line);transition:transform .3s var(--spring),border-color .25s var(--ease)}
.sw.on{color:var(--txt)}.sw.on span{border-color:var(--acc);transform:scale(1.1)}
.sw:active span{transform:scale(.92)}
.sug{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--mut)}
.sugbtn{background:rgba(var(--acc-rgb),.14);color:var(--acc);border:0;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .18s var(--ease),background-color .25s}
.sugbtn.up{background:rgba(61,220,132,.16);color:var(--ok)}
.sugbtn:active{transform:scale(.94)}
.sechead{display:flex;justify-content:space-between;align-items:center}
.sechead .sec{margin-bottom:8px}
.link{background:none;border:0;color:var(--acc);font-weight:700;font-size:14px;cursor:pointer;padding:6px 2px}
.routine b{font-size:16px}
.ritem{padding:10px 0;border-bottom:1px solid var(--line)}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rctl{display:flex;align-items:center;gap:6px;margin-top:6px}
.rrep{width:52px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 4px;font-size:16px;text-align:center;color:var(--txt);outline:none}
.rrep:focus{border-color:var(--acc)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:10px -2px 0;padding:0 2px 4px;scrollbar-width:none}.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .chip{flex:none}
.rname{font-weight:600;font-size:14px}
.enote{font-size:12px;color:var(--acc);margin-top:3px;font-weight:600;line-height:1.35}
.stepper{display:flex;align-items:center;gap:2px;background:var(--card2);border-radius:10px;padding:2px}
.stepper button{width:32px;height:32px;border:0;background:none;font-size:18px;font-weight:700;cursor:pointer;border-radius:8px;transition:transform .15s var(--ease)}
.stepper button:active{transform:scale(.85)}
.stepper span{font-size:13px;min-width:50px;text-align:center;font-variant-numeric:tabular-nums}
.rbtns{display:flex}.rbtns .icon{font-size:16px;padding:4px 6px}
.icon:disabled{opacity:.25}
.fl .row{gap:8px;margin-top:6px}.fl .row input{flex:1;min-width:0;margin-top:0}.fl .row .mut{flex:none}
pre.sql{background:var(--card2);border-radius:10px;padding:12px;font-size:11px;overflow:auto;white-space:pre;max-height:40vh}
/* focus view: one exercise per full-screen page */
#focus{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#focus[hidden]{display:none}
.fhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.fhead .link:last-child{justify-self:end}
.ftitle{text-align:center;display:flex;flex-direction:column;line-height:1.25}.ftitle b{font-size:15px}
.ftitle span{font-size:12px;color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}
.fdots{display:flex;justify-content:center;gap:6px;padding:10px 0 2px;flex-wrap:wrap}
.fdot{width:8px;height:8px;border-radius:4px;background:var(--line);border:0;padding:0;cursor:pointer;transition:width .35s var(--spring),background-color .3s var(--ease)}
.fdot.done{background:rgba(61,220,132,.55)}.fdot.on{width:24px;background:var(--acc)}
.ftrack{flex:1;min-height:0;display:flex;will-change:transform}
.fpage{flex:none;width:100vw;height:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:6px 16px calc(120px + env(safe-area-inset-bottom))}
.fin{max-width:560px;margin:0 auto}
.ftop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-top:8px}
.fname{font-size:28px;font-weight:800;line-height:1.12;letter-spacing:-.4px;margin:0}
.fsub{color:var(--mut);font-size:13px;margin-top:6px}
.flast{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0 12px}
.flast .k{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700}
.flast .v{font-size:17px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.4}
.fopts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 6px}
.fopt{padding:13px 2px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:13.5px;cursor:pointer;line-height:1.15;transition:transform .18s var(--ease),background-color .25s var(--ease),color .25s,border-color .25s}
.fopt:active{transform:scale(.95)}.fopt.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.fsug{background:none;border:0;color:var(--mut);font-size:12px;padding:6px 0 10px;cursor:pointer}.fsug b{color:var(--acc)}
.fset{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;margin-bottom:8px;transition:background-color .35s var(--ease),border-color .35s var(--ease)}
.fset.done{background:rgba(61,220,132,.10);border-color:rgba(61,220,132,.35)}.fset.warm .fsn{color:var(--gold)}
.fset-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}.fsn{font-weight:800;background:none;border:0;padding:0;font-size:15px;cursor:pointer}
.fset-ctl{display:flex;align-items:center;gap:8px}
.fstep{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;background:var(--card2);border-radius:12px;flex:1;min-width:0;position:relative;padding:2px 2px 12px}
.fstep button{height:42px;border:0;background:none;font-size:22px;font-weight:700;cursor:pointer;border-radius:10px;transition:transform .15s var(--ease)}
.fstep button:active{transform:scale(.82)}
.fstep input{width:100%;min-width:0;background:transparent;border:0;text-align:center;font-size:22px;font-weight:800;color:var(--txt);outline:none;padding:0;-moz-appearance:textfield}
.fstep input::-webkit-outer-spin-button,.fstep input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fstep small{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;pointer-events:none}
.fchk{width:54px;height:56px;border-radius:12px;border:0;background:var(--card2);font-size:22px;font-weight:800;color:var(--mut);flex:none;cursor:pointer;transition:transform .18s var(--ease),background-color .25s}
.fchk:active{transform:scale(.92)}.fset.done .fchk{background:var(--ok);color:#06210f}
.fsum .li{border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:var(--card)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes pop{from{transform:scale(0);opacity:0}70%{transform:scale(1.25);opacity:1}to{transform:scale(1);opacity:1}}

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); }
const empty = (t, s) => `<div class="card empty"><h2>${t}</h2><p class="mut">${s}</p></div>`;

/* ============ data queries ============ */
function ex(id){ return S.exercises.find(e => e.id === id); }
/* Everything you can pick: your exercises plus the Tonal moves you haven't used yet.
   A library move is only saved to your exercises when you first use or edit it; its id is fixed
   (t_<name>) so two devices adding the same move stay one exercise after sync. */
function catalog(){
  const ids = new Set(S.exercises.map(x => x.id)), names = new Set(S.exercises.map(x => x.name.toLowerCase()));
  return S.exercises.concat(LIB.filter(l => !ids.has(l.id) && !names.has(l.name.toLowerCase())));
}
function ensureEx(id){
  let x = ex(id);
  if (x){ if (x.archived){ x.archived = false; touch(x); } return x; }
  const l = LIB.find(z => z.id === id); if (!l) return null;
  const same = S.exercises.find(z => z.name.toLowerCase() === l.name.toLowerCase()); if (same) return same;
  x = {id:l.id, name:l.name, group:l.group, type:l.type, archived:false, lib:true}; touch(x); S.exercises.push(x);
  return x;
}
function lastUsed(){
  const m = {};
  for (const w of S.workouts) for (const en of w.entries) if (!m[en.exId] || w.start > m[en.exId]) m[en.exId] = w.start;
  return m;
}
function lastSession(exId, excludeId){
  let best = null;
  for (const w of S.workouts){
    if (w.id === excludeId || (best && w.start <= best.start)) continue;
    const en = w.entries.find(e => e.exId === exId);
    if (en && en.sets.some(s => s.r > 0)) best = {start:w.start, sets:en.sets.filter(s => s.r > 0)};
  }
  return best;
}
function lastSets(exId, excludeId){
  let best = null;
  for (const w of S.workouts){
    if (w.id === excludeId || (best && w.start <= best.start)) continue;
    const en = w.entries.find(e => e.exId === exId);
    if (en && en.sets.some(s => s.r > 0)) best = {start: w.start, sets: en.sets.filter(s => s.r > 0)};
  }
  return best ? best.sets : [];
}

/* Progression (double progression): once every top-weight set in the last session reaches the top of the
   rep range, suggest adding the exercise's increment and dropping back to the bottom of the range.
   Otherwise keep the weight and aim for one more rep. */
function repRange(x){ const lo = x.repMin || S.settings.repMin || 8, hi = x.repMax || S.settings.repMax || 12; return [Math.min(lo, hi), Math.max(lo, hi)]; }
/* Increments are whole numbers in the display unit (5 lb, 10 lb, 2 kg…). */
function incDisp(x){ const raw = x && x.inc > 0 ? x.inc : S.settings.inc > 0 ? S.settings.inc : null; return raw ? Math.max(1, Math.round(toD(raw))) : unit() === 'kg' ? 2 : 5; }
function incOf(x){ return fromD(incDisp(x)); }
function suggestion(exId, excludeId, tlo, thi){
  const x = ex(exId); if (!x) return null;
  let [lo, hi] = repRange(x);
  if (tlo > 0){ lo = tlo; hi = thi >= tlo ? thi : tlo; }   // workout-specific target overrides the exercise default
  const prev = lastSets(exId, excludeId).filter(s => !s.warm && s.r > 0);
  if (!prev.length) return {lo, hi, first:true, w:null, r:lo};
  const top = Math.max(...prev.map(s => s.w > 0 ? s.w : 0));
  const topSets = prev.filter(s => (s.w > 0 ? s.w : 0) >= top - 0.001);
  if (topSets.every(s => s.r >= hi)) return {lo, hi, up:true, w:top + incOf(x), r:lo};
  const minR = Math.min(...topSets.map(s => s.r));
  return {lo, hi, w: top > 0 ? top : (x.type === 'reps' ? null : 0), r: Math.max(lo, Math.min(hi, minR + 1))};
}

/* Walk all finished workouts chronologically; build per-exercise sessions, bests, rep maxes and PR events. */
function records(){
  if (recCache) return recCache;
  const byEx = {}, tags = {};
  const ws = [...S.workouts].sort((a, b) => a.start - b.start);
  for (const w of ws){
    w.entries.forEach((en, ei) => {
      const x = ex(en.exId); if (!x) return;
      const R = byEx[en.exId] || (byEx[en.exId] = {best:{w:0, e1:0, reps:0}, rep:{}, events:[], sessions:[]});
      const s = {wid:w.id, t:w.start, maxW:0, e1:0, vol:0, maxR:0, totR:0, n:0, topW:0, topR:0, wi:-1, ei:-1, ri:-1};
      en.sets.forEach((st, si) => {
        if (st.warm || !(st.r > 0)) return;
        const wt = st.w > 0 ? st.w : 0;
        s.n++; s.totR += st.r; s.vol += wt * st.r;
        if (st.r > s.maxR){ s.maxR = st.r; s.ri = si; }
        if (wt > s.maxW){ s.maxW = wt; s.wi = si; }
        const e = e1rm(wt, st.r);
        if (e > s.e1){ s.e1 = e; s.ei = si; s.topW = wt; s.topR = st.r; }
        if (wt > 0) for (const k of REPS) if (st.r >= k && (!R.rep[k] || wt > R.rep[k].w)) R.rep[k] = {w:wt, r:st.r, t:w.start};
      });
      if (!s.n) return;
      const had = R.sessions.length > 0;
      const tag = (si, type) => { const k = `${w.id}:${ei}:${si}`; (tags[k] || (tags[k] = [])).push(type); };
      if (x.type === 'reps'){
        if (had && s.maxR > R.best.reps){ R.events.push({t:w.start, type:'Reps', val:s.maxR, w:false}); tag(s.ri, 'Reps'); }
        if (had && s.maxW > 0 && s.maxW > R.best.w + 0.001){ R.events.push({t:w.start, type:'Added', val:s.maxW, w:true}); tag(s.wi, 'Added'); }
      } else {
        if (had && s.maxW > R.best.w + 0.001){ R.events.push({t:w.start, type:'Weight', val:s.maxW, w:true}); tag(s.wi, 'Weight'); }
        if (had && s.e1 > R.best.e1 + 0.01){ R.events.push({t:w.start, type:'1RM', val:s.e1, w:true}); tag(s.ei, '1RM'); }
      }
      R.best.w = Math.max(R.best.w, s.maxW); R.best.e1 = Math.max(R.best.e1, s.e1); R.best.reps = Math.max(R.best.reps, s.maxR);
      R.sessions.push(s);
    });
  }
  return (recCache = {byEx, tags});
}
function livePR(en, st){
  if (!st.done || st.warm || !(st.r > 0)) return false;
  const R = records().byEx[en.exId]; if (!R || !R.sessions.length) return false;
  const x = ex(en.exId);
  const w = st.w > 0 ? st.w : 0;
  if (x && x.type === 'reps') return st.r > R.best.reps || (w > 0 && w > R.best.w + 0.001);
  return w > R.best.w + 0.001 || e1rm(w, st.r) > R.best.e1 + 0.01;
}

/* ============ rendering ============ */
let view = $('#view');                       // swapped briefly to render a neighbouring tab into the swipe preview
let tab = 'log';
const prog = {exId:null, metric:'e1', range:'6M'};
const openW = new Set();
let exQuery = '', showArch = false, chartState = null;

/* ============ motion ============
   Every action re-renders the view from state.  To keep that smooth, render() measures each
   element carrying a data-k key before and after, then animates the difference (FLIP):
   moved elements glide, resized cards grow or shrink, new elements fade up. */
const EASE = 'cubic-bezier(.22,1,.36,1)', SPRING = 'cubic-bezier(.32,.72,0,1)';
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const TABS = ['log', 'history', 'progress', 'exercises'];
function snap(root){
  const m = new Map(); if (reduce.matches || !root) return m;
  root.querySelectorAll('[data-k]').forEach(el => { const r = el.getBoundingClientRect(); m.set(el.dataset.k, {x:r.left + scrollX, y:r.top + scrollY, h:r.height}); });
  return m;
}
function flip(root, first){
  if (reduce.matches || !first || !first.size) return;
  const els = [...root.querySelectorAll('[data-k]')], now = new Map();
  els.forEach(el => { const r = el.getBoundingClientRect(); now.set(el, {x:r.left + scrollX, y:r.top + scrollY, h:r.height}); });
  let entering = 0;
  els.forEach(el => {
    const a = first.get(el.dataset.k), b = now.get(el);
    const par = el.parentElement && el.parentElement.closest('[data-k]');
    const parIn = par && root.contains(par);
    if (!a){
      if (parIn && !first.has(par.dataset.k)) return;          // parent is entering and carries it
      el.animate([{opacity:0, transform:'translateY(10px) scale(.98)'}, {opacity:1, transform:'none'}],
        {duration:380, easing:EASE, delay:Math.min(entering++, 8) * 35, fill:'backwards'});
      return;
    }
    let dx = a.x - b.x, dy = a.y - b.y;
    if (parIn){ const pa = first.get(par.dataset.k), pb = now.get(par); if (pa){ dx -= pa.x - pb.x; dy -= pa.y - pb.y; } }
    const grow = el.classList.contains('card') && Math.abs(a.h - b.h) > 1;
    if (Math.abs(dx) < .5 && Math.abs(dy) < .5 && !grow) return;
    const k0 = {transform:`translate(${dx}px,${dy}px)`}, k1 = {transform:'none'};
    if (grow){ k0.height = a.h + 'px'; k1.height = b.h + 'px'; el.style.overflow = 'hidden'; }
    const an = el.animate([k0, k1], {duration:420, easing:EASE});
    if (grow) an.onfinish = an.oncancel = () => { el.style.overflow = ''; };
  });
}
function animateOut(el){
  if (!el || reduce.matches) return Promise.resolve();
  const cs = getComputedStyle(el), h = el.getBoundingClientRect().height;
  el.style.overflow = 'hidden'; el.style.pointerEvents = 'none';
  return el.animate([
    {opacity:1, height:h + 'px', marginTop:cs.marginTop, marginBottom:cs.marginBottom, paddingTop:cs.paddingTop, paddingBottom:cs.paddingBottom, transform:'none'},
    {opacity:0, height:'0px', marginTop:'0px', marginBottom:'0px', paddingTop:'0px', paddingBottom:'0px', transform:'scale(.96)'}
  ], {duration:280, easing:EASE, fill:'forwards'}).finished.catch(() => {});
}
function pop(el, big){
  if (!el || reduce.matches) return;
  el.animate(big ? [{transform:'scale(0) rotate(-20deg)'}, {transform:'scale(1.35) rotate(6deg)', offset:.6}, {transform:'none'}]
                 : [{transform:'scale(.7)'}, {transform:'scale(1.15)', offset:.55}, {transform:'none'}], {duration:big ? 620 : 420, easing:EASE});
}
function revealEntry(id){
  const el = view.querySelector(`[data-k="${id}"]`); if (!el) return;
  const r = el.getBoundingClientRect();
  if (r.bottom > innerHeight - 90 || r.top < 60) window.scrollTo({top:Math.max(0, scrollY + r.top - 80), behavior:reduce.matches ? 'auto' : 'smooth'});
}

let shownTab = null;
const RENDER = {log:renderLog, history:renderHistory, progress:renderProgress, exercises:renderExercises};

/* ============ swipe between tabs ============
   The neighbouring tab is rendered into a fixed "peek" layer beside the page.  While your finger
   is down, the page, the peek and the tab highlight all track it 1:1; on release they glide to the
   nearest tab with momentum, or spring back.  Tapping a tab uses the same slide. */
const peek = document.createElement('div'); peek.id = 'peek'; peek.innerHTML = '<div class="peekin"></div>'; document.body.appendChild(peek);
const SWIPE_EASE = 'cubic-bezier(.2,.85,.25,1)';
let sw = null, swAnims = [];
function renderPeek(t){
  const saved = view, savedChart = chartState;
  view = peek.firstChild;
  try { RENDER[t](); } finally { view = saved; chartState = savedChart; }
  peek.style.top = $('#top').getBoundingClientRect().bottom + 'px';
  peek.style.display = 'block';
}
function hidePeek(){ peek.getAnimations().forEach(a => a.cancel()); peek.style.display = 'none'; peek.style.transform = ''; peek.firstChild.innerHTML = ''; }
function setIndicator(pos, animate){
  const el = $('#tabind'); el.style.transition = animate ? '' : 'none';
  el.style.transform = `translateX(${pos * 100}%)`;
}
function finishTab(t){
  view.getAnimations().forEach(a => a.cancel()); view.style.transform = ''; view.classList.remove('swiping');
  tab = t; shownTab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  setIndicator(TABS.indexOf(t), true);
  RENDER[t](); window.scrollTo(0, 0); hidePeek();
  const icon = document.querySelector(`#tabs button[data-tab="${t}"] svg`);
  if (icon && !reduce.matches) icon.animate([{transform:'scale(1)'}, {transform:'scale(1.22) translateY(-2px)', offset:.4}, {transform:'scale(1)'}], {duration:420, easing:EASE});
}
function slideToTab(t){
  if (t === tab) return;
  swAnims.forEach(a => a.finish()); swAnims = [];
  if (reduce.matches){ finishTab(t); return; }
  const W = innerWidth, dir = Math.sign(TABS.indexOf(t) - TABS.indexOf(tab));
  renderPeek(t);
  setIndicator(TABS.indexOf(t), true);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  view.classList.add('swiping');
  const o = {duration:380, easing:SWIPE_EASE, fill:'forwards'};
  const a1 = view.animate([{transform:'translateX(0)'}, {transform:`translateX(${-dir * W}px)`}], o);
  const a2 = peek.animate([{transform:`translateX(${dir * W}px)`}, {transform:'translateX(0)'}], o);
  swAnims = [a1, a2];
  a1.onfinish = () => { a2.cancel(); swAnims = []; finishTab(t); };
}
function swipeBlocked(e){
  return e.pointerType === 'mouse' || !$('#modal').hidden || e.clientX < 18 || e.clientX > innerWidth - 18 ||
    e.target.closest('input, select, textarea, #chart, .chips.scroll, .stepper');
}
view.addEventListener('pointerdown', e => {
  if (swipeBlocked(e)) return;
  swAnims.forEach(a => a.finish());
  sw = {x0:e.clientX, y0:e.clientY, x:e.clientX, t:performance.now(), v:0, locked:false, dir:0, id:e.pointerId};
});
view.addEventListener('pointermove', e => {
  if (!sw || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0, now = performance.now();
  sw.v = (e.clientX - sw.x) / Math.max(1, now - sw.t); sw.x = e.clientX; sw.t = now;
  if (!sw.locked){
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; }          // it's a scroll
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
    sw.locked = true; view.classList.add('swiping');
    try { view.setPointerCapture(e.pointerId); } catch (err) {}
  }
  const W = innerWidth, i = TABS.indexOf(tab), dir = dx < 0 ? 1 : -1, target = TABS[i + dir];
  if (dir !== sw.dir){ sw.dir = dir; sw.target = target; if (target) renderPeek(target); else hidePeek(); }
  const off = target ? dx : dx * .25;                                                       // rubber band past the first/last tab
  view.style.transform = `translateX(${off}px)`;
  if (target) peek.style.transform = `translateX(${off + dir * W}px)`;
  setIndicator(i - off / W * (target ? 1 : 0), false);
  e.preventDefault();
});
function endSwipe(e){
  if (!sw || (e && e.pointerId !== sw.id)) return;
  const s0 = sw; sw = null;
  if (!s0.locked) return;
  const W = innerWidth, dx = s0.x - s0.x0, i = TABS.indexOf(tab), target = s0.target;
  const flick = Math.abs(s0.v) > .45 && Math.sign(s0.v) === Math.sign(dx);
  const go = target && (Math.abs(dx) > W * .28 || flick);
  const off = target ? dx : dx * .25;
  if (go){
    const remaining = W - Math.abs(off), ms = Math.max(160, Math.min(340, remaining / Math.max(Math.abs(s0.v), 1.2)));
    const o = {duration:ms, easing:SWIPE_EASE, fill:'forwards'};
    setIndicator(TABS.indexOf(target), true);
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === target));
    const a1 = view.animate([{transform:`translateX(${off}px)`}, {transform:`translateX(${-s0.dir * W}px)`}], o);
    const a2 = peek.animate([{transform:`translateX(${off + s0.dir * W}px)`}, {transform:'translateX(0)'}], o);
    swAnims = [a1, a2];
    a1.onfinish = () => { a2.cancel(); swAnims = []; finishTab(target); };
  } else {
    const o = {duration:320, easing:SPRING};
    setIndicator(i, true);
    const a1 = view.animate([{transform:`translateX(${off}px)`}, {transform:'translateX(0)'}], o);
    const anims = [a1];
    if (target) anims.push(peek.animate([{transform:`translateX(${off + s0.dir * W}px)`}, {transform:`translateX(${s0.dir * W}px)`}], {duration:320, easing:SPRING, fill:'forwards'}));
    view.style.transform = '';
    swAnims = anims;
    a1.onfinish = () => { swAnims = []; view.classList.remove('swiping'); hidePeek(); };
  }
}
view.addEventListener('pointerup', endSwipe);
view.addEventListener('pointercancel', endSwipe);
// a swipe that ends on a button must not also "tap" it
view.addEventListener('click', e => { if (view.classList.contains('swiping')) { e.stopPropagation(); e.preventDefault(); } }, true);

function render(){ renderMain(); renderFocus(); }
function renderMain(){
  const switching = shownTab !== tab, from = shownTab;
  const first = switching ? null : snap(view);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#tabind').style.transform = `translateX(${TABS.indexOf(tab) * 100}%)`;
  RENDER[tab]();
  shownTab = tab;
  if (!switching){ flip(view, first); return; }
  if (reduce.matches) return;
  const dir = from === null ? 0 : Math.sign(TABS.indexOf(tab) - TABS.indexOf(from));
  view.animate([{opacity:0, transform:dir ? `translateX(${dir * 28}px)` : 'translateY(10px)'}, {opacity:1, transform:'none'}], {duration:360, easing:EASE});
  const icon = document.querySelector(`#tabs button[data-tab="${tab}"] svg`);
  if (icon && from !== null) icon.animate([{transform:'scale(1)'}, {transform:'scale(1.25) translateY(-2px)', offset:.4}, {transform:'scale(1)'}], {duration:450, easing:EASE});
}

function defaultName(){ const h = new Date().getHours(); return h < 11 ? 'Morning Workout' : h < 17 ? 'Afternoon Workout' : 'Evening Workout'; }
const newSet = (o = {}) => Object.assign({id:uid(), w:null, r:null, warm:false, done:false}, o);

      <div class="mut sm">${r.items.map(it => { const x = ex(it.exId), [a, z] = it.lo ? [it.lo, it.hi] : x ? repRange(x) : [8, 12]; return `${esc(x ? x.name : '(deleted)')} ${it.sets}×${a === z ? a : `${a}–${z}`}`; }).join(' · ')}</div>

    }).join('');

function entryCard(en, ei){
  const x = ex(en.exId) || {name:'(deleted exercise)', type:'weighted'};
  const isR = x.type === 'reps';
  const prev = lastSets(en.exId, S.active.editingId);
  const R = records().byEx[en.exId];
  const best = R ? (isR ? `Best: ${R.best.reps} reps${R.best.w > 0 ? ` · +${fmtW(R.best.w)} ${unit()}` : ''}` : `Best est. 1RM: ${fmtW(R.best.e1)} ${unit()}`) : 'First time logging this';
  const sg = suggestion(en.exId, S.active.editingId, en.lo, en.hi);
  const sgW = sg && !sg.first && sg.w != null ? sg.w : null, sgR = sg && !sg.first ? sg.r : null;
  let n = 0;
  const rows = en.sets.map((st, si) => {
    const p = prev[si];

function niceTicks(lo, hi, n){
  const span = hi - lo || 1, raw = span / (n - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const start = Math.max(0, Math.floor(lo / step) * step), end = Math.ceil(hi / step) * step;
  const t = []; for (let v = start; v <= end + step / 2; v += step) t.push(+v.toFixed(6));
  if (t.length < 2) t.push(+(start + step).toFixed(6));
  return t;
}
function fmtAxis(v){ if (v >= 10000) return (v / 1000).toFixed(v >= 100000 ? 0 : 1).replace(/\.0$/, '') + 'k'; return String(r1(v)); }
function axDate(t, span){ return new Date(t).toLocaleDateString(undefined, span > 330 * 86400000 ? {month:'short', year:'2-digit'} : {month:'short', day:'numeric'}); }

function chartSVG(pts, priorMax, fmtY, weighted){
  const W = 640, H = 300, L = 58, Rm = 16, T = 40, B = 34;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x1 - x0 < 86400000){ x0 -= 3 * 86400000; x1 += 3 * 86400000; }
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 1e-9){ lo = lo * 0.9; hi = hi * 1.1 || 1; } else { const p = (hi - lo) * 0.08; lo -= p; hi += p; }
  const ticks = niceTicks(Math.max(0, lo), hi, 5), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - Rm), sy = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (const t of ticks){ const y = sy(t).toFixed(1); g += `<line x1="${L}" x2="${W - Rm}" y1="${y}" y2="${y}" class="grid"/><text x="${L - 8}" y="${(+y + 6).toFixed(1)}" class="ax" text-anchor="end">${fmtAxis(t)}</text>`; }
  for (let i = 0; i <= 3; i++){ const t = x0 + (x1 - x0) * i / 3; g += `<text x="${sx(t).toFixed(1)}" y="${H - 8}" class="ax" text-anchor="${i === 0 ? 'start' : i === 3 ? 'end' : 'middle'}">${axDate(t, x1 - x0)}</text>`; }
  const P = pts.map(p => [sx(p.x), sy(p.y)]);
  const line = P.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const base = sy(y0).toFixed(1);
  const area = P.length > 1 ? `${line} L${P[P.length - 1][0].toFixed(1)} ${base} L${P[0][0].toFixed(1)} ${base} Z` : '';
  let mx = priorMax, dots = '';
  pts.forEach((p, i) => { const pr = mx > -Infinity && p.y > mx + 1e-9; if (p.y > mx) mx = p.y;
    const d = (.1 + .85 * (P[i][0] - L) / (W - L - Rm)).toFixed(2);
    dots += `<circle cx="${P[i][0].toFixed(1)}" cy="${P[i][1].toFixed(1)}" r="${pr ? 6 : 4}" class="dot${pr ? ' pr' : ''}" style="--d:${d}s"/>`; });
  chartState = {pts, P, W, fmtY, weighted};
  return `<div class="chartwrap"><div class="tip" id="tip"></div>
    <svg id="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">
      <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc)" stop-opacity=".35"/><stop offset="1" style="stop-color:var(--acc)" stop-opacity="0"/></linearGradient></defs>
      ${g}${area ? `<path d="${area}" class="area" fill="url(#ag)"/>` : ''}<path d="${line}" class="ln" pathLength="1"/>${dots}
      <line id="xh" class="xh" y1="${T}" y2="${H - B}" x1="0" x2="0"/><circle id="hl" r="8" cx="0" cy="0" class="hl"/>
    </svg></div>`;
}
function bindChart(){
  const svg = $('#chart'); if (!svg || !chartState) return;
  const show = e => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * chartState.W;
    let bi = 0, bd = Infinity;
    chartState.P.forEach((p, i) => { const d = Math.abs(p[0] - vx); if (d < bd){ bd = d; bi = i; } });
    const [px, py] = chartState.P[bi], p = chartState.pts[bi];
    const xh = $('#xh'), hl = $('#hl'), tip = $('#tip');
    xh.style.transform = `translateX(${px}px)`; hl.style.transform = `translate(${px}px,${py}px)`; svg.classList.add('hover');
    const top = chartState.weighted && p.s.topW ? `<br><span class="mut">Top set ${fmtW(p.s.topW)} × ${p.s.topR}</span>` : '';
    tip.innerHTML = `<b>${chartState.fmtY(p.y)}</b> · ${shortDate(p.x)}${top}`;
    tip.hidden = false; tip.classList.add('on');
    tip.style.left = Math.min(82, Math.max(18, px / chartState.W * 100)) + '%';
  };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', e => { if (e.pointerType !== 'mouse') return;
    $('#tip').classList.remove('on'); svg.classList.remove('hover'); });
}

/* ============ modals ============ */
let mClose = null, drag = null;
function modal(html){
  const m = $('#modal'), sh = $('#sheet');
  const wasOpen = !m.hidden;                                       // includes a sheet mid-exit: swap content instead
  if (mClose){ clearTimeout(mClose.t); mClose.anims.forEach(a => a.cancel()); mClose = null; }
  const h0 = wasOpen ? sh.getBoundingClientRect().height : 0;
  sh.innerHTML = '<div class="grab" data-grab></div>' + html;
  sh.style.transform = ''; m.style.backgroundColor = ''; m.style.pointerEvents = '';
  m.hidden = false; sh.scrollTop = 0;
  if (reduce.matches) return;
  const kids = [...sh.children].slice(1);
  if (wasOpen){
    const h1 = sh.getBoundingClientRect().height;
    if (Math.abs(h1 - h0) > 1) sh.animate([{height:h0 + 'px'}, {height:h1 + 'px'}], {duration:380, easing:SPRING});
    kids.forEach((k, i) => k.animate([{opacity:0, transform:'translateY(6px)'}, {opacity:1, transform:'none'}], {duration:260, easing:EASE, delay:Math.min(i, 6) * 25, fill:'backwards'}));
  } else {
    m.animate([{backgroundColor:'rgba(0,0,0,0)'}, {backgroundColor:'rgba(0,0,0,.6)'}], {duration:320, easing:'ease-out'});
    sh.animate([{transform:'translateY(100%)'}, {transform:'none'}], {duration:520, easing:SPRING});
    kids.forEach((k, i) => k.animate([{opacity:0, transform:'translateY(14px)'}, {opacity:1, transform:'none'}], {duration:420, easing:EASE, delay:80 + Math.min(i, 6) * 35, fill:'backwards'}));
  }
}
function closeModal(){
  const m = $('#modal'), sh = $('#sheet');
  if (m.hidden || mClose) return;
  const done = () => { m.hidden = true; sh.innerHTML = ''; sh.style.transform = ''; m.style.backgroundColor = ''; m.style.pointerEvents = ''; mClose = null; };
  if (reduce.matches){ done(); return; }
  m.style.pointerEvents = 'none';                                  // never swallow taps during the exit
  const t0 = getComputedStyle(sh).transform, bg0 = getComputedStyle(m).backgroundColor;
  const a1 = sh.animate([{transform:t0 === 'none' ? 'none' : t0}, {transform:'translateY(100%)'}], {duration:300, easing:'cubic-bezier(.4,0,.9,.6)', fill:'forwards'});
  const a2 = m.animate([{backgroundColor:bg0}, {backgroundColor:'rgba(0,0,0,0)'}], {duration:300, easing:'ease-in', fill:'forwards'});
  mClose = {anims:[a1, a2], t:setTimeout(() => { a1.cancel(); a2.cancel(); done(); }, 300)};
}
(() => {
  const sh = $('#sheet'), m = $('#modal');
  sh.addEventListener('pointerdown', e => {
    if (!e.target.closest('[data-grab]') || mClose) return;
    drag = {y0:e.clientY, y:e.clientY, t:performance.now(), v:0, dy:0};
    sh.setPointerCapture(e.pointerId);
  });
  sh.addEventListener('pointermove', e => {
    if (!drag) return;
    const now = performance.now(), raw = e.clientY - drag.y0;
    drag.v = (e.clientY - drag.y) / Math.max(1, now - drag.t); drag.y = e.clientY; drag.t = now;
    drag.dy = raw < 0 ? raw * .2 : raw;                              // rubber-band upward
    sh.style.transform = `translateY(${drag.dy}px)`;
    m.style.backgroundColor = `rgba(0,0,0,${(.6 * (1 - Math.min(1, Math.max(0, drag.dy) / 500))).toFixed(3)})`;
  });
  const end = () => {
    if (!drag) return;
    const {dy, v} = drag; drag = null;
    if (dy > 110 || v > .55){ closeModal(); return; }
    sh.animate([{transform:`translateY(${dy}px)`}, {transform:'none'}], {duration:420, easing:SPRING});
    sh.style.transform = ''; m.style.backgroundColor = '';
  };
  sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);
})();

/* ============ cloud sync (Supabase, plain REST — no library) ============
   The whole log is stored as one JSON document per user in table overload_state.
   Each sync pulls the remote copy, merges it with this device item by item (newest edit wins,
   deletions win over older edits), saves the result here, and pushes it back if it changed.
   The in-progress workout never syncs; it stays on the device until you finish it. */
const SYNC_KEY = 'overload.sync';
const SETUP_SQL = `create table if not exists public.overload_state (
  user_id uuid primary key default auth.uid() references auth.users (id) on delete cascade,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
alter table public.overload_state enable row level security;
grant select, insert, update, delete on public.overload_state to authenticated;
drop policy if exists "Users manage their own log" on public.overload_state;
create policy "Users manage their own log" on public.overload_state
  for all using (auth.uid() = user_id) with check (auth.uid() = user_id);`;
function SC(){ try { return JSON.parse(localStorage.getItem(SYNC_KEY) || '{}'); } catch (e) { return {}; } }
function saveSC(c){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(c)); } catch (e) {} }
const syncOn = () => { const c = SC(); return !!(c.url && c.key && c.refresh && c.userId); };
let syncing = false, syncAgain = false, syncTimer = null, syncMsg = '';
function scheduleSync(ms){ if (!syncOn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), ms || 2500); }
function ago(t){ const s = (Date.now() - t) / 1000; return s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : shortDate(t); }
function syncLabel(){ const c = SC(); return syncMsg || (c.last ? `Last synced ${ago(c.last)}.` : 'Not synced yet.'); }
function setSync(msg){ syncMsg = msg; const el = $('#syncStat'); if (el) el.textContent = syncLabel(); }
const sbBase = c => c.url.trim().replace(/\/+$/, '');
function sbErr(j, status){ return (j && (j.error_description || j.msg || j.message || j.error)) || `HTTP ${status}`; }
async function sbAuth(path, body){
  const c = SC();
  const r = await fetch(`${sbBase(c)}/auth/v1/${path}`, {method:'POST', headers:{apikey:c.key, 'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(sbErr(j, r.status));
  return j;
}
function storeSession(j, email){
  const c = SC();
  Object.assign(c, {access:j.access_token, refresh:j.refresh_token, exp:Date.now() + (j.expires_in || 3600) * 1000, userId:(j.user && j.user.id) || c.userId});
  if (email) c.email = email;
  saveSC(c);
}
async function ensureToken(force){
  const c = SC();
  if (!force && c.access && Date.now() < (c.exp || 0) - 60000) return;
  try { storeSession(await sbAuth('token?grant_type=refresh_token', {refresh_token:c.refresh})); }
  catch (e) { if (/invalid|expired|not found|revoked/i.test(e.message)){ const d = SC(); delete d.access; delete d.refresh; saveSC(d); throw new Error('Signed out. Sign in again in Settings.'); } throw e; }
}
async function sbRest(path, opts, retry){
  await ensureToken(false);
  const c = SC(), o = opts || {};
  const r = await fetch(`${sbBase(c)}/rest/v1/${path}`, Object.assign({}, o, {headers:Object.assign({apikey:c.key, Authorization:`Bearer ${c.access}`, 'Content-Type':'application/json'}, o.headers || {})}));
  if (r.status === 401 && retry !== false){ await ensureToken(true); return sbRest(path, opts, false); }
  if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(r.status === 404 ? 'A Supabase table is missing. Run the setup SQL in Supabase (Settings, Show setup SQL).' : sbErr(j, r.status)); }
  return r;
}
function payload(st){
  const byId = (a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
  return {v:1, settings:st.settings, exercises:[...st.exercises].sort(byId), workouts:[...st.workouts].sort(byId), routines:[...st.routines].sort(byId), deleted:st.deleted};
}
const canon = d => payload(normalize(JSON.parse(JSON.stringify(Object.assign({}, d, {active:null})))));
function mergeState(a, b){
  const del = Object.assign({}, a.deleted);
  for (const [k, v] of Object.entries(b.deleted || {})) del[k] = Math.max(del[k] || 0, v);
  const merge = (x, y) => {
    const m = new Map();
    for (const it of [...(x || []), ...(y || [])]){ const c = m.get(it.id); if (!c || (it.u || 0) > (c.u || 0)) m.set(it.id, it); }
    return [...m.values()].filter(it => !(del[it.id] >= (it.u || 0)));
  };
  return {v:1, settings:((b.settings && b.settings.u) || 0) > ((a.settings && a.settings.u) || 0) ? b.settings : a.settings,
    exercises:merge(a.exercises, b.exercises), workouts:merge(a.workouts, b.workouts), routines:merge(a.routines, b.routines), deleted:del};
}
async function syncNow(manual){
  if (!syncOn()) return;
  if (syncing){ syncAgain = true; return; }
  if (!navigator.onLine){ setSync("Offline. Will sync when you're back online."); return; }
  syncing = true; setSync('Syncing…');
  try {
    const c = SC();
    const rows = await (await sbRest(`overload_state?select=data&user_id=eq.${encodeURIComponent(c.userId)}`)).json();
    const remote = rows[0] ? canon(rows[0].data) : null;
    const local = canon(S);
    const next = remote ? canon(mergeState(local, remote)) : local;
    const nextStr = JSON.stringify(next);
    if (nextStr !== JSON.stringify(local)){
      const active = S.active, prevTheme = S.settings.theme;
      S = normalize(Object.assign(JSON.parse(nextStr), {active})); recCache = null; persist();
      if (S.settings.theme !== prevTheme) applyTheme(true);
    }
    if (nextStr !== JSON.stringify(local) && !(document.activeElement && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))) render();   // never yank a field you're typing in
    if (!remote || nextStr !== JSON.stringify(remote)){
      await sbRest('overload_state', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify({user_id:c.userId, data:next, updated_at:new Date().toISOString()})});
    }
    const c2 = SC(); c2.last = Date.now(); saveSC(c2); setSync('');
    if (manual) toast('Synced');
  } catch (e) {
    setSync(`Sync failed: ${e.message}`);
    if (manual) toast(`Sync failed: ${e.message}`);
    if (!syncOn() && $('#syncStat')) openSettings();           // session expired: swap to the sign-in form
  } finally {
    syncing = false;
    if (syncAgain){ syncAgain = false; scheduleSync(500); }
  }
}
window.addEventListener('online', () => scheduleSync(500));
document.addEventListener('visibilitychange', () => { if (!document.hidden && syncOn() && Date.now() - (SC().last || 0) > 30000) syncNow(false); });

function syncSection(){
  const c = SC();
  if (!c.url || !c.key) return `<h3 class="sec">Cloud sync</h3>
    <p class="mut sm" style="margin:0">Off.  Connect a free Supabase project to back up your log and use it on more than one device.</p>
    <label class="fl">Supabase project URL<input id="sbUrl" placeholder="https://xxxx.supabase.co" value="${esc(c.url || '')}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="fl">Anon / publishable key<input id="sbKey" value="${esc(c.key || '')}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="stack"><button class="btn" data-a="sbSave">Connect project</button><button class="btn ghost" data-a="showSQL">Show setup SQL</button></div>`;
  if (!c.refresh || !c.userId) return `<h3 class="sec">Cloud sync</h3>

    modal(`<h2>${esc(ex(en.exId)?.name || '')}</h2><div class="stack">
      <button class="btn" data-a="goprog" data-id="${en.exId}">View progress</button>
      ${ei > 0 ? `<button class="btn" data-a="move" data-e="${ei}" data-d="-1">Move up</button>` : ''}
      ${ei < n - 1 ? `<button class="btn" data-a="move" data-e="${ei}" data-d="1">Move down</button>` : ''}
      <button class="btn ghost danger" data-a="rmentry" data-e="${ei}">Remove exercise</button>
      <button class="btn ghost" data-a="close">Cancel</button></div>`); },
  move: b => { const e = act().entries, i = +b.dataset.e, j = i + +b.dataset.d; [e[i], e[j]] = [e[j], e[i]]; save(); closeModal(); render(); },
  rmentry: async b => { const en = act().entries[+b.dataset.e]; closeModal();
    await animateOut(view.querySelector(`[data-k="${en.id}"]`)); act().entries.splice(act().entries.indexOf(en), 1); save(); render(); },
  goprog: b => { closeModal(); prog.exId = b.dataset.id; tab = 'progress'; render(); window.scrollTo(0, 0); },
  cancel: () => { if (confirm(act().editingId ? 'Discard your changes to this workout?' : 'Discard this workout? Nothing will be saved.')){ S.active = null; hideRest(); save(); render(); } },
  finish: () => finishFlow(),
  fin: b => commitWorkout(b.dataset.m),
  rest: b => { const d = b.dataset.d; if (d === 'skip' || !restEnd){ hideRest(); return; }
    restEnd = Math.max(Date.now() + 1000, restEnd + +d * 1000); restTotal = Math.max(1, restTotal + +d); },
  toggleW: b => { const id = b.dataset.id; openW.has(id) ? openW.delete(id) : openW.add(id); render(); },
  delW: async b => { if (!confirm('Delete this workout permanently?')) return; const id = b.dataset.id;
    await animateOut(view.querySelector(`[data-k="${id}"]`)); tomb(id); S.workouts = S.workouts.filter(w => w.id !== id); openW.delete(id); save(); render(); },
  editW: b => {
    if (S.active){ toast('Finish or discard the current workout first'); return; }
    const w = S.workouts.find(x => x.id === b.dataset.id); if (!w) return;
    S.active = {id:w.id, editingId:w.id, start:w.start, name:w.name, dur:Math.round((w.end - w.start) / 60000),
      entries: w.entries.map(en => ({id:uid(), exId:en.exId, sets:en.sets.map(s => newSet({w:s.w, r:s.r, warm:!!s.warm, done:true}))}))};
    save(); tab = 'log'; render(); window.scrollTo(0, 0);
  },
  metric: b => { prog.metric = b.dataset.m; render(); },
  range: b => { prog.range = b.dataset.r; render(); },
  newEx: b => exForm({name: b.dataset.name || '', group: 'Other', type: 'weighted'}, true, b.dataset.ctx || ''),
  editEx: b => { const x = ex(b.dataset.id); if (x) exForm(x, false, ''); else { const l = LIB.find(z => z.id === b.dataset.id); if (l) exForm(l, true, ''); } },
  saveEx: b => {
    const name = $('#exName').value.trim().replace(/\s+/g, ' '), group = $('#exGroup').value, type = $('#exType').value, isNew = b.dataset.new === '1', id = b.dataset.id;
    if (!name){ toast('Give it a name'); return; }
    if (S.exercises.some(x => x.id !== id && x.name.toLowerCase() === name.toLowerCase())){ toast('An exercise with that name already exists'); return; }
    const lo = parseInt($('#exLo').value, 10), hi = parseInt($('#exHi').value, 10), incV = Number($('#exInc').value);
    if (!(lo >= 1 && hi >= lo && hi <= 100)){ toast('Check the rep range'); return; }
    if (!(Number.isInteger(incV) && incV >= 1)){ toast('Use a whole number for the increment'); return; }
    const fields = {name, group, type, repMin:lo, repMax:hi, inc: incV > 0 ? fromD(incV) : null};
    let newId = null;
    if (!isNew){ const x = ex(id); Object.assign(x, fields); touch(x); }
    else {
      const x = Object.assign({id:id || uid(), archived:false}, fields, id && id.startsWith('t_') ? {lib:true} : {}); touch(x); S.exercises.push(x);
      if (b.dataset.ctx === 'picker' && pickMode === 'routine' && rDraft){ rDraft.items.push({exId:x.id, sets:3, k:uid()}); pickMode = 'workout'; save(); openRoutineEditor(); return; }
      if (b.dataset.ctx === 'picker' && S.active){ newId = uid(); S.active.entries.push({id:newId, exId:x.id, sets:[newSet()]}); }
    }
    save(); closeModal(); render(); if (newId) revealEntry(newId);
  },
  archEx: b => { const x = ex(b.dataset.id); x.archived = !x.archived; touch(x); save(); closeModal(); render(); },
  delEx: b => { if (!confirm('Delete this exercise?')) return; tomb(b.dataset.id); S.exercises = S.exercises.filter(x => x.id !== b.dataset.id); save(); closeModal(); render(); },
  toggleArch: b => { showArch = b.checked; renderExList(true); },
  theme: b => { S.settings.theme = b.dataset.t; touchSettings(); applyTheme(true); save();
    document.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); },
  unit: b => { S.settings.unit = b.dataset.u; touchSettings(); save(); openSettings(); render(); },
  sbSave: () => {
    const url = $('#sbUrl').value.trim(), key = $('#sbKey').value.trim();
    if (!/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:/])[^ ]+$/.test(url)){ toast('Enter the project URL, starting with https://'); return; }
    if (key.length < 20){ toast('Paste the anon or publishable key'); return; }
    saveSC({url, key}); openSettings();
  },
  showSQL: () => {
    modal(`<h2>Setup SQL</h2><p class="mut sm">In Supabase, open <b>SQL Editor</b>, paste this, and click <b>Run</b>.  It creates one private table that only your account can read or write.</p>
      <pre class="sql">${esc(SETUP_SQL)}</pre><div class="stack"><button class="btn primary" data-a="copySQL">Copy SQL</button><button class="btn ghost" data-a="settings">Back to settings</button></div>`);
  },
  copySQL: () => { (navigator.clipboard ? navigator.clipboard.writeText(SETUP_SQL) : Promise.reject()).then(() => toast('SQL copied')).catch(() => toast('Copy failed. Select the text and copy it')); },
  sbIn: async b => {
    const email = $('#sbEmail').value.trim(), password = $('#sbPass').value;
    if (!email || !password){ toast('Enter your email and password'); return; }
    b.disabled = true; b.textContent = 'Signing in…';
    try { storeSession(await sbAuth('token?grant_type=password', {email, password}), email); openSettings(); await syncNow(true); }
    catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Sign in'; }
  },
  sbUp: async b => {
    const email = $('#sbEmail').value.trim(), password = $('#sbPass').value;
    if (!email || password.length < 6){ toast('Enter an email and a password of 6+ characters'); return; }
    b.disabled = true; b.textContent = 'Creating account…';
    try {
      const j = await sbAuth('signup', {email, password});
      if (j.access_token){ storeSession(j, email); openSettings(); await syncNow(true); }
      else { const c = SC(); c.email = email; saveSC(c); toast('Account created. Confirm it from your email, then tap Sign in'); b.disabled = false; b.textContent = 'Create account'; }
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Create account'; }
  },
  sbSync: () => syncNow(true),
  sbOut: () => { const c = SC(); ['access', 'refresh', 'exp', 'userId', 'last'].forEach(k => delete c[k]); saveSC(c); syncMsg = ''; openSettings(); toast('Signed out. Your log stays on this device'); },
  sbForget: () => { saveSC({}); openSettings(); },
  exportJSON: () => download(`overload-backup-${ymd()}.json`, JSON.stringify(S), 'application/json'),
  exportCSV: () => exportCSV(),
  wipe: () => { if (!confirm('Erase all workouts, exercises and routines? If sync is on, this erases them on your other devices too.')) return;
    const del = Object.assign({}, S.deleted), t = Date.now(); [...S.exercises, ...S.workouts, ...S.routines].forEach(o => { del[o.id] = t; });
    S = fresh(); S.deleted = del; dirty = true; save(); closeModal(); tab = 'log'; render(); toast('All data erased'); },
};

document.addEventListener('click', e => {
  if (e.target.id === 'modal'){ closeModal(); return; }
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const f = A[b.dataset.a]; if (f) f(b, e);
});
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  if (f === 'w' || f === 'r'){
    const st = setAt(t), v = parseFloat(t.value);
    if (f === 'w') st.w = isFinite(v) && v >= 0 ? fromD(v) : null;
    else st.r = isFinite(v) && v >= 0 ? Math.round(v) : null;
    updatePR(+t.dataset.e, +t.dataset.s); saveSoon();
  }
  else if (f === 'name'){ act().name = t.value; saveSoon(); }
  else if (f === 'rname'){ if (rDraft) rDraft.name = t.value; }
  else if ((f === 'rlo' || f === 'rhi') && rDraft){ const it = rDraft.items[+t.dataset.i], v = parseInt(t.value, 10); it[f === 'rlo' ? 'lo' : 'hi'] = v >= 1 && v <= 100 ? v : undefined; }
  else if (f === 'dur'){ act().dur = parseInt(t.value, 10) || 60; saveSoon(); }
  else if (f === 'exq'){ exQuery = t.value; renderExList(true); }
  else if (f === 'pq'){ renderPick(t.value, true); }
});
document.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  if (f === 'start'){ const v = new Date(t.value).getTime(); if (isFinite(v)){ const a = act(); a.start = v; a.manual = true; a.dur = a.dur || 60; save(); render(); } }
  else if (f === 'progEx'){ prog.exId = t.value; render(); }
  else if (f === 'formula'){ S.settings.formula = t.value; touchSettings(); save(); }
  else if (f === 'rest'){ S.settings.rest = +t.value; touchSettings(); save(); }
  else if (f === 'defLo' || f === 'defHi'){
    const v = Math.max(1, Math.min(100, parseInt(t.value, 10) || 1));
    if (f === 'defLo'){ S.settings.repMin = v; if (S.settings.repMax < v) S.settings.repMax = v; } else { S.settings.repMax = v; if (S.settings.repMin > v) S.settings.repMin = v; }
    touchSettings(); save(); openSettings();
  }
  else if (f === 'defInc'){ const v = Math.round(Number(t.value)); if (!(v >= 1)){ toast('Use a whole number for the increment'); openSettings(); return; } S.settings.inc = fromD(v); touchSettings(); save(); openSettings(); }
  else if (f === 'import'){ importFile(t.files[0]); }
});

if (focusOpen()) fIdx = firstOpenEntry();
render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => {});
if (syncOn()) setTimeout(() => syncNow(false), 800);
</script>
</body>
</html>
