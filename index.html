.chip.on,.seg button.on,.rot button.on{background-image:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0));box-shadow:0 6px 16px -8px rgba(var(--acc-rgb),.7)}
.hero .btn.primary{position:relative;overflow:hidden}
.hero .btn.primary::after{content:'';position:absolute;top:0;bottom:0;width:45%;left:-60%;transform:skewX(-20deg);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));animation:sheen 1.1s var(--ease) .7s 1 both}
.stat{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--card2);border:1px solid rgba(255,255,255,.03)}
.stat .v{letter-spacing:-.3px}
#tabind::after{box-shadow:0 0 24px -4px rgba(var(--acc-rgb),.45)}
nav#tabs button.on{font-weight:700}
/* springy press: quick in, bouncy out */
.btn,.chip,.icon,.seg button,.rot button,.stepper button{transition:transform .5s var(--spring),background-color .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease),box-shadow .3s var(--ease),opacity .2s}
.btn:active,.chip:active,.icon:active,.seg button:active,.rot button:active{transform:scale(.95);transition-duration:.09s}.card.routine:active{transform:scale(.985);transition-duration:.09s}
.flame{display:inline-block;transform-origin:50% 90%;animation:flame 2.2s ease-in-out infinite}
@keyframes flame{0%,100%{transform:rotate(-4deg) scale(1)}25%{transform:rotate(3deg) scale(1.08)}50%{transform:rotate(-2deg) scale(.96)}75%{transform:rotate(4deg) scale(1.05)}}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#splash img{width:84px;height:84px;border-radius:20px;box-shadow:0 16px 40px -12px rgba(var(--acc-rgb),.6)}
#splash b{font-size:24px;font-weight:800;letter-spacing:-.3px}#splash b span{color:var(--acc)}
#toast{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:600}
#toast::before{content:'✓';display:inline-grid;place-items:center;width:18px;height:18px;margin-right:8px;border-radius:50%;background:var(--ok);color:#06210f;font-size:11px;font-weight:900;vertical-align:1px}
#toast.plain::before{display:none}
.sheet{box-shadow:0 -20px 60px -20px rgba(0,0,0,.6)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes sheen{to{left:130%}}
@keyframes pop{from{transform:scale(0);opacity:0}70%{transform:scale(1.25);opacity:1}to{transform:scale(1);opacity:1}}

/* ============ state ============ */
function fresh(){

function normalize(d){
  const f = fresh(), purged = !!(d.settings && d.settings.seedPurged);

  if (!THEMES.some(t => t.id === d.settings.theme)) d.settings.theme = 'glacier';
  d.exercises = Array.isArray(d.exercises) ? d.exercises : [];
  d.exercises.forEach(x => { if (!GROUPS.includes(x.group)) x.group = 'Other'; if (x.type !== 'reps') x.type = 'weighted'; x.archived = !!x.archived; });
  d.workouts = Array.isArray(d.workouts) ? d.workouts.filter(w => w && Array.isArray(w.entries)) : [];
  d.routines = Array.isArray(d.routines) ? d.routines.filter(r => r && Array.isArray(r.items)) : [];
  // My Workouts keep their own order (o); sync stores items sorted by id, which would otherwise reshuffle them.
  const PLAN = ['plan_push-a', 'plan_pull-a', 'plan_legs-a', 'plan_push-b', 'plan_pull-b', 'plan_legs-b'];
  d.routines.forEach((r, i) => { if (typeof r.o !== 'number') r.o = PLAN.includes(r.id) ? PLAN.indexOf(r.id) : 100 + i; });

  d.tonal = d.tonal && typeof d.tonal === 'object' && !Array.isArray(d.tonal) ? d.tonal : {};

  if (Array.isArray(d.settings.plans)) d.settings.plans.forEach(v => { if (v && Array.isArray(v.days))
    v.days = v.days.map(id => !id ? 'any' : id === 'rest' || id === 'any' ? id : ((d.routines.find(r => r.id === id) || {}).name || id)); });
  delete d.settings.rotation;
  if (d.settings.plans != null) d.settings.plans = Array.isArray(d.settings.plans) ? d.settings.plans.filter(v => v && isFinite(v.from) && (v.days === null || (Array.isArray(v.days) && v.days.length === 7))) : [];

  if (!(w > 0) || !(r > 0)) return 0;

  let v = 0;

    w.entries.forEach((en, ei) => {

function niceTicks(lo, hi, n){
  const span = hi - lo || 1, raw = span / (n - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const start = Math.max(0, Math.floor(lo / step) * step), end = Math.ceil(hi / step) * step;
  const t = []; for (let v = start; v <= end + step / 2; v += step) t.push(+v.toFixed(6));
  if (t.length < 2) t.push(+(start + step).toFixed(6));
  return t;
}
function fmtAxis(v){ if (v > 0 && v < 10 && !Number.isInteger(v)) return String(+v.toFixed(2)); if (v >= 10000) return (v / 1000).toFixed(v >= 100000 ? 0 : 1).replace(/\.0$/, '') + 'k'; return String(r1(v)); }
function axDate(t, span){ return new Date(t).toLocaleDateString(undefined, span > 330 * 86400000 ? {month:'short', year:'2-digit'} : {month:'short', day:'numeric'}); }

function chartSVG(pts, priorMax, fmtY, weighted){
  const W = 640, H = 300, L = 58, Rm = 16, T = 40, B = 34;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x1 - x0 < 86400000){ x0 -= 3 * 86400000; x1 += 3 * 86400000; }
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 1e-9){ lo = lo * 0.9; hi = hi * 1.1 || 1; } else { const p = (hi - lo) * 0.08; lo -= p; hi += p; }
  const ticks = niceTicks(Math.max(0, lo), hi, 5), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - Rm), sy = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (const t of ticks){ const y = sy(t).toFixed(1); g += `<line x1="${L}" x2="${W - Rm}" y1="${y}" y2="${y}" class="grid"/><text x="${L - 8}" y="${(+y + 6).toFixed(1)}" class="ax" text-anchor="end">${fmtAxis(t)}</text>`; }
  for (let i = 0; i <= 3; i++){ const t = x0 + (x1 - x0) * i / 3; g += `<text x="${sx(t).toFixed(1)}" y="${H - 8}" class="ax" text-anchor="${i === 0 ? 'start' : i === 3 ? 'end' : 'middle'}">${axDate(t, x1 - x0)}</text>`; }
  const P = pts.map(p => [sx(p.x), sy(p.y)]);
  const line = P.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const base = sy(y0).toFixed(1);
  const area = P.length > 1 ? `${line} L${P[P.length - 1][0].toFixed(1)} ${base} L${P[0][0].toFixed(1)} ${base} Z` : '';
  let mx = priorMax, dots = '';
  pts.forEach((p, i) => { const pr = mx > -Infinity && p.y > mx + 1e-9; if (p.y > mx) mx = p.y;
    const d = (.1 + .85 * (P[i][0] - L) / (W - L - Rm)).toFixed(2);
    dots += `<circle cx="${P[i][0].toFixed(1)}" cy="${P[i][1].toFixed(1)}" r="${pr ? 6 : 4}" class="dot${pr ? ' pr' : ''}" style="--d:${d}s"/>`; });
  chartState = {pts, P, W, fmtY, weighted};
  return `<div class="chartwrap"><div class="tip" id="tip"></div>
    <svg id="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">
      <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc)" stop-opacity=".35"/><stop offset="1" style="stop-color:var(--acc)" stop-opacity="0"/></linearGradient></defs>
      ${g}${area ? `<path d="${area}" class="area" fill="url(#ag)"/>` : ''}<path d="${line}" class="ln" pathLength="1"/>${dots}
      <line id="xh" class="xh" y1="${T}" y2="${H - B}" x1="0" x2="0"/><circle id="hl" r="8" cx="0" cy="0" class="hl"/>
    </svg></div>`;
}
function bindChart(){
  const svg = $('#chart'); if (!svg || !chartState) return;
  const show = e => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * chartState.W;
    let bi = 0, bd = Infinity;
    chartState.P.forEach((p, i) => { const d = Math.abs(p[0] - vx); if (d < bd){ bd = d; bi = i; } });
    const [px, py] = chartState.P[bi], p = chartState.pts[bi];

let mClose = null, drag = null;
function modal(html){
  const m = $('#modal'), sh = $('#sheet');
  const wasOpen = !m.hidden;                                       // includes a sheet mid-exit: swap content instead
  if (mClose){ clearTimeout(mClose.t); mClose.anims.forEach(a => a.cancel()); mClose = null; }

    kids.forEach((k, i) => k.animate([{opacity:0, transform:'translateY(6px)'}, {opacity:1, transform:'none'}], {duration:260, easing:EASE, delay:Math.min(i, 6) * 25, fill:'backwards'}));

function closeModal(){
  const m = $('#modal'), sh = $('#sheet');

  const done = () => { m.hidden = true; sh.innerHTML = ''; sh.style.transform = ''; m.style.backgroundColor = ''; m.style.pointerEvents = ''; mClose = null; };
  if (reduce.matches){ done(); return; }
  m.style.pointerEvents = 'none';                                  // never swallow taps during the exit
  const t0 = getComputedStyle(sh).transform, bg0 = getComputedStyle(m).backgroundColor;
  const a1 = sh.animate([{transform:t0 === 'none' ? 'none' : t0}, {transform:'translateY(100%)'}], {duration:300, easing:'cubic-bezier(.4,0,.9,.6)', fill:'forwards'});
  const a2 = m.animate([{backgroundColor:bg0}, {backgroundColor:'rgba(0,0,0,0)'}], {duration:300, easing:'ease-in', fill:'forwards'});

}
(() => {
  const sh = $('#sheet'), m = $('#modal');
  sh.addEventListener('pointerdown', e => {
    if (!e.target.closest('[data-grab]') || mClose) return;
    drag = {y0:e.clientY, y:e.clientY, t:performance.now(), v:0, dy:0};
    sh.setPointerCapture(e.pointerId);
  });
  sh.addEventListener('pointermove', e => {
    if (!drag) return;
    const now = performance.now(), raw = e.clientY - drag.y0;
    drag.v = (e.clientY - drag.y) / Math.max(1, now - drag.t); drag.y = e.clientY; drag.t = now;
    drag.dy = raw < 0 ? raw * .2 : raw;                              // rubber-band upward
    sh.style.transform = `translateY(${drag.dy}px)`;
    m.style.backgroundColor = `rgba(0,0,0,${(.6 * (1 - Math.min(1, Math.max(0, drag.dy) / 500))).toFixed(3)})`;
  });
  const end = () => {
    if (!drag) return;
    const {dy, v} = drag; drag = null;
    if (dy > 110 || v > .55){ closeModal(); return; }
    sh.animate([{transform:`translateY(${dy}px)`}, {transform:'none'}], {duration:420, easing:SPRING});
    sh.style.transform = ''; m.style.backgroundColor = '';
  };
  sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);
})();

    setSync(`Sync failed: ${e.message}`);
    if (manual) toast(`Sync failed: ${e.message}`);
    if (!syncOn() && $('#syncStat')) openSettings();           // session expired: swap to the sign-in form
  } finally {
    syncing = false;
    if (syncAgain){ syncAgain = false; scheduleSync(500); }
  }
}
window.addEventListener('online', () => scheduleSync(500));
document.addEventListener('visibilitychange', () => { if (!document.hidden && syncOn() && Date.now() - (SC().last || 0) > 30000) syncNow(false);
  if (!document.hidden && tonalOn() && Date.now() - (tnState().at || 0) > 10 * 60000) setTimeout(() => tnImport(false), 1500); });

/* ============ Tonal import ============
   Workouts come from Tonal through the "tonal" Supabase function, which runs hourly and whenever the app asks.
   The app only stores a status summary; the Tonal login token lives in the database, out of the app's reach. */
const tnState = () => SC().tonal || {};
const tonalOn = () => syncOn() && !!tnState().connected;
let tnBusy = false;
async function tnCall(action, extra){
  await ensureToken(false);
  const c = SC();
  const go = () => fetch(`${sbBase(c)}/functions/v1/tonal`, {method:'POST', headers:{apikey:c.key, Authorization:`Bearer ${SC().access}`, 'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({action}, extra || {}))});
  let r = await go();
  if (r.status === 401 && action !== 'connect'){ await ensureToken(true); r = await go(); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 404 && !j.error) throw new Error('The tonal importer isn\'t deployed in Supabase yet');
  if (!r.ok || j.ok === false) throw new Error(j.error || `Importer error ${r.status}`);
  return j;
}
function tnSave(patch){ const c = SC(); c.tonal = Object.assign({}, c.tonal || {}, patch); saveSC(c); }
async function tnImport(manual){
  if (!tonalOn() || tnBusy) return;
  tnBusy = true;
  try {
    const j = await tnCall('sync');
    tnSave({at:Date.now(), err:null});
    if (j.imported || j.replaced) await syncNow(false);
    if (manual || j.imported) toast(j.imported ? `Imported ${j.imported} workout${j.imported > 1 ? 's' : ''} from Tonal` : 'Up to date with Tonal');
  } catch (e) {
    tnSave({err:e.message});
    if (manual) toast(e.message);
  } finally { tnBusy = false; if ($('#tnStat')) openSettings(); else if (tab === 'log') render(); }
}
function tnLabel(){
  const t = tnState();
  return t.err ? `Last import failed: ${t.err}` : t.at ? `Last import ${ago(t.at)}.` : 'Not imported yet.';
}
function tnNote(){
  if (!tonalOn()) return `<div class="tnnote"><span><b>Connect Tonal</b> in Settings and your workouts import automatically.</span><button class="link" data-a="settings">Settings</button></div>`;
  return `<div class="tnnote"><span><b>Do it on Tonal.</b>  It appears here after you finish.  <span class="mut">${esc(tnLabel())}</span></span><button class="link" data-a="tnSync">Import now</button></div>`;
}
function tonalSection(){
  const t = tnState();
  if (!syncOn()) return `<h3 class="sec">Tonal</h3><p class="mut sm" style="margin:0">Sign in to cloud sync above first, then connect Tonal to import your workouts automatically.</p>`;
  if (!t.connected) return `<h3 class="sec">Tonal</h3>
    <p class="mut sm" style="margin:0">Import every Tonal workout automatically, hourly and whenever you open the app.  Your password goes to your own importer once and is never stored.  Days you logged by hand are replaced with Tonal's version.</p>
    <label class="fl">Tonal email<input id="tnEmail" type="email" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="fl">Tonal password<input id="tnPass" type="password" autocomplete="off"></label>
    <div class="stack"><button class="btn primary" data-a="tnConnect">Connect Tonal</button></div>`;
  return `<h3 class="sec">Tonal</h3>
    <p class="mut sm" style="margin:0">Connected.  <span id="tnStat">${esc(tnLabel())}</span>${t.n ? `  ${t.n} workouts imported in total.` : ''}</p>
    <div class="stack"><button class="btn" data-a="tnSync">Import now</button><button class="btn" data-a="tnMoves">Review Tonal moves</button><button class="btn ghost" data-a="tnOff">Disconnect Tonal</button></div>`;
}
function openTnMoves(){
  const mv = Object.entries((S.tonal && S.tonal.moves) || {}).sort((a, b) => a[1].n.localeCompare(b[1].n));
  const opts = sel => catalog().slice().sort((a, b) => a.name.localeCompare(b.name)).map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  modal(`<h2>Tonal moves</h2><p class="mut sm" style="margin-top:0">Each Tonal move and the Overload exercise its sets are logged under.  Change one if the match is wrong; every imported session moves with it.  Barbell moves are doubled because Tonal records weight per cable.</p>
    <div class="card list">${mv.length ? mv.map(([id, m]) => `<div class="tnrow"><b>${esc(m.n)}</b><div class="row"><select data-f="tnmap" data-id="${esc(id)}">${opts(m.ex)}</select>
      <label class="tnx"><input type="checkbox" data-f="tnx" data-id="${esc(id)}" ${m.x === 2 ? 'checked' : ''}>×2</label></div></div>`).join('') : '<div class="li mut">Nothing imported yet</div>'}</div>
    <div class="stack"><button class="btn primary" data-a="close">Done</button></div>`);
}
function tnRemap(mid, ex2, x2){
  const m = S.tonal.moves[mid]; if (!m) return;
  if (ex2 && ex2 !== m.ex){ const x = ensureEx(ex2); if (!x) return; m.ex = x.id; }
  if (x2 && x2 !== m.x) m.x = x2;
  m.auto = false; S.tonal.u = Date.now();
  let n = 0;
  for (const w of S.workouts){
    let hit = false;
    for (const en of w.entries) if (en.tm === mid){
      en.exId = m.ex;
      for (const st of en.sets) if (st.w > 0 && (st.tx || 1) !== m.x){ st.w = Math.round(st.w / (st.tx || 1) * m.x * 100) / 100; if (m.x === 1) delete st.tx; else st.tx = m.x; }
      hit = true;
    }
    if (hit){ touch(w); n++; }
  }
  recCache = null; save(); dirty = true;
  toast(`Updated ${n} session${n === 1 ? '' : 's'}`);
}

function syncSection(){
  const c = SC();
  if (!c.url || !c.key) return `<h3 class="sec">Cloud sync</h3>
    <p class="mut sm" style="margin:0">Off.  Connect a free Supabase project to back up your log and use it on more than one device.</p>
    <label class="fl">Supabase project URL<input id="sbUrl" placeholder="https://xxxx.supabase.co" value="${esc(c.url || '')}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="fl">Anon / publishable key<input id="sbKey" value="${esc(c.key || '')}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="stack"><button class="btn" data-a="sbSave">Connect project</button><button class="btn ghost" data-a="showSQL">Show setup SQL</button></div>`;
  if (!c.refresh || !c.userId) return `<h3 class="sec">Cloud sync</h3>
    <p class="mut sm" style="margin:0">Back up your log and use it on any device.  Create an account on your first device; sign in with the same email and password on the others.</p>
    <label class="fl">Email<input id="sbEmail" type="email" value="${esc(c.email || '')}" autocomplete="username" autocapitalize="off" spellcheck="false"></label>
    <label class="fl">Password<input id="sbPass" type="password" autocomplete="current-password"></label>
    <div class="stack"><button class="btn primary" data-a="sbIn">Sign in</button><button class="btn" data-a="sbUp">Create account</button><button class="btn ghost" data-a="sbForget">${c.url === DEFAULT_SB.url ? 'Use my own Supabase project' : 'Disconnect project'}</button></div>`;
  return `<h3 class="sec">Cloud sync</h3>
    <p class="mut sm" style="margin:0">On.  Signed in as <b>${esc(c.email || '')}</b>.  <span id="syncStat">${esc(syncLabel())}</span></p>
    <div class="stack"><button class="btn" data-a="sbSync">Sync now</button><button class="btn ghost" data-a="sbOut">Sign out</button></div>`;
}

/* ============ actions ============ */
const A = {
  tab: b => { if (b.dataset.tab === tab){ window.scrollTo({top:0, behavior:'smooth'}); return; } slideToTab(b.dataset.tab); },
  settings: () => openSettings(),
  close: () => closeModal(),
  setHap: b => { S.settings.haptics = b.dataset.v === '1'; touchSettings(); save(); document.querySelectorAll('[data-a=setHap]').forEach(x => x.classList.toggle('on', x === b)); haptic('medium'); },
  progView: b => { prog.view = b.dataset.v; render(); },
  wk: b => { prog.wk = Math.max(0, (prog.wk || 0) + +b.dataset.d); render(); },
  bwLog: () => {
    const v = Number($('#bwIn').value), dv = $('#bwDate').value;
    if (!(v > 0)){ toast('Enter your bodyweight'); return; }
    const [y, mo, d] = (dv || ymd()).split('-').map(Number), t = new Date(y, mo - 1, d, 12).getTime();
    if (!isFinite(t) || t > Date.now() + 86400000){ toast('Pick a date up to today'); return; }
    const lb = Math.round(fromD(v) * 100) / 100, same = S.bodyweight.find(b => dayDiff(b.t, t) === 0);
    if (same){ same.w = lb; same.t = t; touch(same); } else { const b = {id:uid(), t, w:lb}; touch(b); S.bodyweight.push(b); }
    save(); render(); toast(`Logged ${fmtW(lb)} ${unit()}`);
  },
  bwDel: b => { tomb(b.dataset.id); S.bodyweight = S.bodyweight.filter(x => x.id !== b.dataset.id); save(); render(); },
  dayPick: b => { const k = +b.dataset.i; heroDay = heroDay === k || (heroDay == null && k === dowOf(Date.now()) && !streak().todayDone) ? null : k; render(); },
  schedEdit: () => { const p = planFor(Date.now()); sched = {days: p ? p.days.slice() : defaultWeek()}; openSched(); },
  schedSave: () => {
    const today = dayStart(Date.now()), keep = plans().filter(v => v.from !== today);
    if (!sched.days.some(id => id !== 'rest')){ toast('Plan at least one workout day'); return; }
    S.settings.plans = keep.concat({from: today, days: sched.days.slice()});
    touchSettings(); heroDay = null; save(); closeModal(); render(); toast('Plan saved');
  },
  planOff: () => {
    const today = dayStart(Date.now());
    S.settings.plans = plans().filter(v => v.from !== today).concat({from: today, days: null});
    touchSettings(); heroDay = null; save(); closeModal(); render(); toast('Plan turned off');
  },

  goprog: b => { closeModal(); prog.exId = b.dataset.id; tab = 'progress'; render(); window.scrollTo(0, 0); },
  toggleW: b => { const id = b.dataset.id; openW.has(id) ? openW.delete(id) : openW.add(id); render(); },
  delW: async b => { if (!confirm('Delete this workout permanently?')) return; const id = b.dataset.id;
    await animateOut(view.querySelector(`[data-k="${id}"]`)); tomb(id); S.workouts = S.workouts.filter(w => w.id !== id); openW.delete(id); save(); render(); },
  metric: b => { prog.metric = b.dataset.m; render(); },
  range: b => { prog.range = b.dataset.r; render(); },
  theme: b => { S.settings.theme = b.dataset.t; touchSettings(); applyTheme(true); save();
    document.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); },
  unit: b => { S.settings.unit = b.dataset.u; touchSettings(); save(); openSettings(); render(); },
  sbSave: () => {
    const url = $('#sbUrl').value.trim(), key = $('#sbKey').value.trim();
    if (!/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:/])[^ ]+$/.test(url)){ toast('Enter the project URL, starting with https://'); return; }
    if (key.length < 20){ toast('Paste the anon or publishable key'); return; }
    saveSC({url, key}); openSettings();
  },
  showSQL: () => {
    modal(`<h2>Setup SQL</h2><p class="mut sm">In Supabase, open <b>SQL Editor</b>, paste this, and click <b>Run</b>.  It creates one private table that only your account can read or write.</p>
      <pre class="sql">${esc(SETUP_SQL)}</pre><div class="stack"><button class="btn primary" data-a="copySQL">Copy SQL</button><button class="btn ghost" data-a="settings">Back to settings</button></div>`);
  },
  copySQL: () => { (navigator.clipboard ? navigator.clipboard.writeText(SETUP_SQL) : Promise.reject()).then(() => toast('SQL copied')).catch(() => toast('Copy failed. Select the text and copy it')); },
  sbIn: async b => {
    const email = $('#sbEmail').value.trim(), password = $('#sbPass').value;
    if (!email || !password){ toast('Enter your email and password'); return; }
    b.disabled = true; b.textContent = 'Signing in…';
    try { storeSession(await sbAuth('token?grant_type=password', {email, password}), email); openSettings(); await syncNow(true); }
    catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Sign in'; }
  },
  sbUp: async b => {
    const email = $('#sbEmail').value.trim(), password = $('#sbPass').value;
    if (!email || password.length < 6){ toast('Enter an email and a password of 6+ characters'); return; }
    b.disabled = true; b.textContent = 'Creating account…';
    try {
      const j = await sbAuth('signup', {email, password});
      if (j.access_token){ storeSession(j, email); openSettings(); await syncNow(true); }
      else { const c = SC(); c.email = email; saveSC(c); toast('Account created. Confirm it from your email, then tap Sign in'); b.disabled = false; b.textContent = 'Create account'; }
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Create account'; }
  },
  sbSync: () => syncNow(true),
  sbOut: () => { const c = SC(); ['access', 'refresh', 'exp', 'userId', 'last'].forEach(k => delete c[k]); saveSC(c); syncMsg = ''; openSettings(); toast('Signed out. Your log stays on this device'); },
  tnConnect: async b => {
    const email = $('#tnEmail').value.trim(), password = $('#tnPass').value;
    if (!email || !password){ toast('Enter your Tonal email and password'); return; }
    b.disabled = true; b.textContent = 'Connecting and importing…';
    try {
      const j = await tnCall('connect', {email, password});
      tnSave({connected:true, at:Date.now(), err:null, n:j.imported});
      await syncNow(true);
      openSettings();
      toast(`Imported ${j.imported} workout${j.imported === 1 ? '' : 's'} from Tonal${j.replaced ? ` · replaced ${j.replaced} logged by hand` : ''}`);
      if (j.imported) setTimeout(() => { celebrate(); haptic('success'); }, 300);
    } catch (e) { b.disabled = false; b.textContent = 'Connect Tonal'; toast(e.message); }
  },
  tnSync: () => tnImport(true),
  tnMoves: () => openTnMoves(),
  tnOff: async () => {
    if (!confirm('Disconnect Tonal?  Workouts already imported stay in your log.')) return;
    try { await tnCall('disconnect'); } catch (e) { /* forget locally either way */ }
    tnSave({connected:false, at:0, err:null}); openSettings(); render();
  },
  sbForget: () => { saveSC(SC().url === DEFAULT_SB.url ? {custom:true} : {}); openSettings(); },
  exportJSON: () => download(`overload-backup-${ymd()}.json`, JSON.stringify(S), 'application/json'),
  exportCSV: () => exportCSV(),
  wipe: () => { if (!confirm('Erase all workouts, exercises and routines? If sync is on, this erases them on your other devices too.')) return;
    const del = Object.assign({}, S.deleted), t = Date.now(); [...S.exercises, ...S.workouts, ...S.routines, ...S.bodyweight].forEach(o => { del[o.id] = t; });
    S = fresh(); S.deleted = del; dirty = true; save(); closeModal(); tab = 'log'; render(); toast('All data erased'); },
};

document.addEventListener('click', e => {
  if (e.target.id === 'modal'){ closeModal(); return; }
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const f = A[b.dataset.a]; if (f) f(b, e);
});
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  if (f === 'exq'){ exQuery = t.value; renderExList(true); }
});
document.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  if (f === 'progEx'){ prog.exId = t.value; render(); }
  else if (f === 'tnmap'){ tnRemap(t.dataset.id, t.value, null); }
  else if (f === 'tnx'){ tnRemap(t.dataset.id, null, t.checked ? 2 : 1); }
  else if (f === 'pday' && sched){ sched.days[+t.dataset.i] = t.value; }
  else if (f === 'formula'){ S.settings.formula = t.value; touchSettings(); save(); }
  else if (f === 'import'){ importFile(t.files[0]); }
});

if ((navigator.standalone || matchMedia('(display-mode: standalone)').matches) && !reduce.matches){
  const sp = document.createElement('div'); sp.id = 'splash';
  sp.innerHTML = '<img src="icons/icon-192.png" alt=""><b>Over<span>load</span></b>'; document.body.appendChild(sp);
  sp.firstChild.animate([{transform:'scale(.6)', opacity:0}, {transform:'scale(1.06)', opacity:1, offset:.6}, {transform:'none', opacity:1}], {duration:520, easing:EASE});
  setTimeout(() => { const a = sp.animate([{opacity:1, transform:'none'}, {opacity:0, transform:'scale(1.08)'}], {duration:380, easing:EASE, fill:'forwards'});
    a.onfinish = () => sp.remove();
    view.querySelectorAll('[data-k]').forEach((el, k) => { if (k < 10) el.animate([{opacity:0, transform:'translateY(18px)'}, {opacity:1, transform:'none'}], {duration:520, easing:EASE, delay:120 + k * 45, fill:'backwards'}); });
  }, 650);
}
render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => {});
if (syncOn()) setTimeout(() => syncNow(false), 800);
if (tonalOn() && Date.now() - (tnState().at || 0) > 10 * 60000) setTimeout(() => tnImport(false), 2500);
</script>
</body>
</html>
