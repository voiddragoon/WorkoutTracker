<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironbook">
<title>Ironbook</title>
<style>
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.32,.72,0,1);--bg:#0e0f12;--card:#17191f;--card2:#20232b;--line:#2a2e38;--txt:#e9ebf0;--mut:#8b90a0;--acc:#ff7a1a;--gold:#ffc83d;--ok:#3ddc84;--bad:#ff5a5f;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
button,input,select{font-family:inherit;color:inherit}
header#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(14,15,18,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0;letter-spacing:.3px}h1 b{color:var(--acc)}
h2{font-size:18px;margin:0 0 6px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:18px 2px 8px;font-weight:700}
.sec.gold{color:var(--gold)}
main{padding:14px 14px calc(150px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav#tabs{position:fixed;isolation:isolate;bottom:0;left:0;right:0;display:flex;background:rgba(18,19,24,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav#tabs button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav#tabs button.on{color:var(--acc)}
#tabind{position:absolute;top:5px;left:0;width:25%;height:46px;z-index:-1;transition:transform .5s var(--spring);pointer-events:none}
#tabind::after{content:'';position:absolute;inset:0 18%;border-radius:14px;background:rgba(255,122,26,.12)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.btn{appearance:none;border:0;border-radius:11px;padding:12px 16px;font-size:15px;font-weight:600;background:var(--card2);cursor:pointer;text-align:center;display:inline-block}
.btn.primary{background:var(--acc);color:#1a0d00}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%;display:block}
.btn.sm{padding:9px 12px;font-size:14px}
.btn.add{margin-top:4px;border:1px dashed var(--line);background:transparent;color:var(--acc)}
.row{display:flex;align-items:center}.gap{gap:8px}.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.center{text-align:center}
.hero h2{font-size:22px}.hero p{margin:4px 0 14px}
.rowcard{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;cursor:pointer}
.badge{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--mut);font-weight:600;white-space:nowrap}
.badge.gold{background:rgba(255,200,61,.15);color:var(--gold)}
/* active workout */
.active-head .wname{width:100%;background:transparent;border:0;font-size:20px;font-weight:700;padding:0;outline:none}
.active-head .meta{display:flex;align-items:center;gap:8px;margin:6px 0 12px;color:var(--mut);font-size:13px;flex-wrap:wrap}
.active-head input[type=datetime-local]{background:var(--card2);border:0;border-radius:8px;padding:5px 8px;font-size:13px;color:var(--mut)}
.active-head .dur input{width:64px;background:var(--card2);border:0;border-radius:8px;padding:5px 8px;font-size:16px;text-align:center}
.active-head .row .btn{flex:1}
#elapsed{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:700}
.ehead{display:flex;justify-content:space-between;align-items:center}
.ename{background:none;border:0;padding:0;font-size:16px;font-weight:700;color:var(--acc);text-align:left;cursor:pointer}
.sethead,.set{display:grid;grid-template-columns:34px 1fr 78px 64px 44px;gap:6px;align-items:center}
.entry.reps .sethead,.entry.reps .set{grid-template-columns:34px 1fr 78px 44px}
.sethead{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:10px 0 4px;text-align:center}
.sethead span:nth-child(2){text-align:left;padding-left:4px}
.set{position:relative;padding:4px 2px;border-radius:10px;margin-bottom:2px}
.set.done{background:rgba(61,220,132,.10)}
.set input{width:100%;background:var(--card2);border:1px solid transparent;border-radius:8px;font-size:16px;padding:9px 4px;text-align:center;outline:none;-moz-appearance:textfield}
.set input:focus{border-color:var(--acc)}
.set input::-webkit-outer-spin-button,.set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set.done input{background:transparent}
.sn{height:36px;border:0;border-radius:8px;background:transparent;font-weight:700;cursor:pointer}
.set.warm .sn{color:var(--gold)}
.prev{background:none;border:0;color:var(--mut);font-size:13px;text-align:left;padding:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{height:38px;border-radius:9px;border:0;background:var(--card2);color:var(--mut);font-size:18px;font-weight:800;cursor:pointer}
.set.done .chk{background:var(--ok);color:#06210f}
.prtag{position:absolute;left:-6px;top:-5px;background:var(--gold);color:#2a1d00;font-size:9px;font-weight:800;padding:1px 4px;border-radius:5px;z-index:1}
.prtag:empty{display:none}
/* rest bar */
#restbar{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));max-width:700px;margin:0 auto;background:#22252e;border:1px solid var(--line);border-radius:14px;overflow:hidden;z-index:7;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#restbar{transform:translateY(calc(100% + 100px));opacity:0;pointer-events:none;transition:transform .55s var(--spring),opacity .35s var(--ease)}
#restbar.show{transform:none;opacity:1;pointer-events:auto}
#restbar .fill{position:absolute;inset:0;background:rgba(255,122,26,.18);transform:scaleX(0);transform-origin:left;transition:transform .25s linear,background-color .4s}
#restbar.fin .fill{background:rgba(61,220,132,.25)}
.rb-in{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px}
.rb-in b{font-size:20px;font-variant-numeric:tabular-nums;flex:1}
.rb-btns{display:flex;gap:6px}
.rb-btns button{background:var(--card2);border:0;border-radius:8px;padding:8px 10px;font-weight:600;cursor:pointer}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);overscroll-behavior:contain;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{position:relative;will-change:transform;background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:26px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.grab{position:absolute;top:0;left:0;right:0;height:26px;touch-action:none;cursor:grab}
.grab::after{content:'';position:absolute;left:50%;top:9px;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:#3a3f4b}
.search{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
.search:focus{border-color:var(--acc)}
.list{display:flex;flex-direction:column}
.card.list{padding:4px 0}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;text-align:left;cursor:pointer;width:100%}
.li:last-child{border-bottom:0}
.li.create{color:var(--acc);font-weight:600}
.fl{display:block;font-size:13px;color:var(--mut);margin:12px 0 0}
.fl input,.fl select{display:block;width:100%;margin-top:6px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--txt);outline:none}
select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.seg{display:flex;gap:6px;margin-top:6px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:600;cursor:pointer}
.seg button.on{background:var(--acc);color:#1a0d00;border-color:var(--acc)}
.filebtn{position:relative}
.tog{display:flex;align-items:center;gap:6px;margin:10px 2px 0}
/* history */
.whead{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.wsum{margin-top:8px}
.wbody{margin-top:12px}
.went{padding:8px 0;border-top:1px solid var(--line)}
.wname2{font-weight:600;color:var(--acc);cursor:pointer;margin-bottom:4px}
.wsets{display:flex;flex-wrap:wrap;gap:6px}
.ws{font-size:13px;background:var(--card2);padding:4px 8px;border-radius:7px;font-variant-numeric:tabular-nums}
.ws.warm{color:var(--gold)}
.ws.pr{background:rgba(255,200,61,.15);color:var(--gold)}
.wbody .row{margin-top:12px}
/* progress */
.exsel{width:100%;font-weight:600;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);color:#1a0d00;border-color:var(--acc)}
.chips.range{justify-content:center;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.stats.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:480px){.stats.four{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card2);border-radius:11px;padding:10px}
.stat .k{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.down{color:var(--bad)}
.chartwrap{position:relative;margin-top:4px}
svg#chart{width:100%;height:auto;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#chart .grid{stroke:var(--line);stroke-width:1}
#chart .ax{fill:var(--mut);font-size:17px}
#chart .ln{fill:none;stroke:var(--acc);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
#chart .dot{fill:var(--bg);stroke:var(--acc);stroke-width:2.5}
#chart .dot.pr{fill:var(--gold);stroke:var(--gold)}
#chart .xh{stroke:var(--mut);stroke-dasharray:4 4}
#chart .hl{fill:none;stroke:var(--txt);stroke-width:2}
.tip{position:absolute;top:2px;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid var(--line);padding:5px 9px;border-radius:8px;font-size:12px;pointer-events:none;white-space:nowrap;text-align:center;z-index:2}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:600;font-size:12px;text-align:left;padding:6px 8px}
td{padding:8px}
tbody tr:nth-child(odd) td{background:var(--card2)}
.num{text-align:right}
.empty{text-align:center;padding:30px 16px}
.empty-sm{text-align:center;padding:40px 0}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:#2b2f3a;border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast{transition:opacity .3s var(--ease),transform .5s var(--spring)}
/* motion */
.btn,.chk,.chip,.sn,.prev,.icon,.ename,.seg button,nav#tabs button,.rb-btns button{transition:transform .18s var(--ease),background-color .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease),opacity .2s}
.btn:active,.chk:active,.chip:active,.icon:active,.seg button:active,.rb-btns button:active{transform:scale(.95)}
.sn:active,.prev:active,.ename:active{opacity:.6}
.li,.rowcard,.whead{transition:background-color .2s var(--ease),transform .18s var(--ease)}
.li:active{background:rgba(255,255,255,.04)}
.rowcard:active{transform:scale(.985)}
nav#tabs button:active svg{transform:scale(.85)}
nav#tabs svg{transition:transform .25s var(--spring)}
.set{transition:background-color .35s var(--ease)}
.set input{transition:background-color .3s var(--ease),border-color .2s var(--ease)}
#chart .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s var(--ease) .05s forwards}
#chart .area{opacity:0;animation:fade .9s var(--ease) .3s forwards}
#chart .dot{transform-box:fill-box;transform-origin:center;animation:pop .45s var(--ease) both;animation-delay:var(--d,0s)}
#chart .xh,#chart .hl{transition:transform .16s var(--ease),opacity .2s;opacity:0}
#chart.hover .xh,#chart.hover .hl{opacity:1}
.tip{transition:left .16s var(--ease),opacity .2s;opacity:0}
.tip.on{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes pop{from{transform:scale(0);opacity:0}70%{transform:scale(1.25);opacity:1}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header id="top">
  <h1>Iron<b>book</b></h1>
  <button class="icon" data-a="settings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</header>
<main id="view"></main>
<div id="restbar">
  <div class="fill" id="restfill"></div>
  <div class="rb-in"><span class="mut sm">Rest</span><b id="resttime">0:00</b>
    <div class="rb-btns"><button data-a="rest" data-d="-15">−15</button><button data-a="rest" data-d="15">+15</button><button data-a="rest" data-d="skip">Skip</button></div>
  </div>
</div>
<nav id="tabs">
  <span id="tabind"></span>
  <button data-a="tab" data-tab="log"><svg class="i" viewBox="0 0 24 24"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Workout</button>
  <button data-a="tab" data-tab="history"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
  <button data-a="tab" data-tab="progress"><svg class="i" viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg>Progress</button>
  <button data-a="tab" data-tab="exercises"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Exercises</button>
</nav>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ============ constants & helpers ============ */
const KEY = 'ironbook.v1';
const LB_PER_KG = 2.20462;
const GROUPS = ['Chest','Back','Legs','Shoulders','Arms','Core','Other'];
const REPS = [1,2,3,5,8,10,12,15];
const RANGES = [['1M',30],['3M',91],['6M',182],['1Y',365],['All',0]];
const PR_LABEL = {Weight:'Heaviest weight', '1RM':'Best est. 1RM', Reps:'Most reps'};
/* Names of the starter library shipped in the first draft — used once to remove unused leftovers. */
const LEGACY_SEED = ['Bench Press (Barbell)','Incline Bench Press (Barbell)','Bench Press (Dumbbell)','Incline Press (Dumbbell)','Chest Fly (Cable)','Dip','Push-Up','Deadlift (Barbell)','Bent-Over Row (Barbell)','Pull-Up','Chin-Up','Lat Pulldown (Cable)','Seated Row (Cable)','One-Arm Row (Dumbbell)','Back Squat (Barbell)','Front Squat (Barbell)','Romanian Deadlift (Barbell)','Leg Press','Bulgarian Split Squat (Dumbbell)','Leg Curl (Machine)','Leg Extension (Machine)','Hip Thrust (Barbell)','Calf Raise','Overhead Press (Barbell)','Shoulder Press (Dumbbell)','Lateral Raise (Dumbbell)','Face Pull (Cable)','Rear Delt Fly (Dumbbell)','Curl (Barbell)','Curl (Dumbbell)','Hammer Curl (Dumbbell)','Triceps Pushdown (Cable)','Skull Crusher (EZ Bar)','Overhead Triceps Extension (Cable)','Hanging Leg Raise','Cable Crunch','Ab Wheel Rollout'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const r1 = x => Math.round(x * 10) / 10;

/* ============ state ============ */
function fresh(){
  return { v:1, settings:{unit:'lb', formula:'epley', rest:120, seedPurged:true}, exercises: [], workouts: [], active: null };
}
function normalize(d){
  const f = fresh(), purged = !!(d.settings && d.settings.seedPurged);
  d.settings = Object.assign({}, f.settings, d.settings || {});
  d.exercises = Array.isArray(d.exercises) ? d.exercises : [];
  d.exercises.forEach(x => { if (!GROUPS.includes(x.group)) x.group = 'Other'; if (x.type !== 'reps') x.type = 'weighted'; x.archived = !!x.archived; });
  d.workouts = Array.isArray(d.workouts) ? d.workouts.filter(w => w && Array.isArray(w.entries)) : [];
  d.active = d.active && Array.isArray(d.active.entries) ? d.active : null;
  if (d.active) d.active.entries.forEach(en => { en.id = en.id || uid(); en.sets.forEach(st => { st.id = st.id || uid(); }); });
  if (!purged){
    const used = new Set(d.workouts.flatMap(w => w.entries.map(e => e.exId)).concat(d.active ? d.active.entries.map(e => e.exId) : []));
    d.exercises = d.exercises.filter(x => used.has(x.id) || !LEGACY_SEED.includes(x.name));
    d.settings.seedPurged = true;
  }
  d.v = 1;
  return d;
}
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); }
  catch (e) { console.warn('load failed', e); }
  return fresh();
}
let S = load();
let recCache = null, saveTimer = null;
function save(){
  clearTimeout(saveTimer); recCache = null;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save. Export a backup from Settings.'); }
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}

/* ============ units & formatting ============ */
const unit = () => S.settings.unit;
const toD = lb => unit() === 'kg' ? lb / LB_PER_KG : lb;
const fromD = v => unit() === 'kg' ? v * LB_PER_KG : v;
const fmtW = lb => { const v = r1(toD(lb || 0)); return Number.isInteger(v) ? String(v) : v.toFixed(1); };
const fmtNum = n => Math.round(n).toLocaleString();
function e1rm(w, r){
  if (!(w > 0) || !(r > 0)) return 0;
  if (r === 1) return w;
  if (S.settings.formula === 'brzycki') return r < 37 ? w * 36 / (37 - r) : 0;
  return w * (1 + r / 30);
}
function fmtClock(ms, ceil){
  let s = ceil ? Math.ceil(ms / 1000) : Math.floor(ms / 1000); s = Math.max(0, s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return h ? `${h}:${pad(m)}:${pad(ss)}` : `${m}:${pad(ss)}`;
}
function fmtDur(ms){ const m = Math.max(1, Math.round(ms / 60000)), h = Math.floor(m / 60); return h ? `${h}h ${pad(m % 60)}m` : `${m}m`; }
function fmtDate(t){
  const d = new Date(t), o = {weekday:'short', month:'short', day:'numeric'};
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
const shortDate = t => new Date(t).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
function toLocalInput(t){ const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function workoutVol(w){
  let v = 0;
  for (const en of w.entries){ const x = ex(en.exId); if (x && x.type === 'reps') continue; for (const s of en.sets) if (!s.warm && s.r > 0 && s.w > 0) v += s.w * s.r; }
  return v;
}
const fmtVol = lb => `${fmtNum(toD(lb))} ${unit()}`;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); }
const empty = (t, s) => `<div class="card empty"><h2>${t}</h2><p class="mut">${s}</p></div>`;

/* ============ data queries ============ */
function ex(id){ return S.exercises.find(e => e.id === id); }
function lastUsed(){
  const m = {};
  for (const w of S.workouts) for (const en of w.entries) if (!m[en.exId] || w.start > m[en.exId]) m[en.exId] = w.start;
  return m;
}
function lastSets(exId, excludeId){
  let best = null;
  for (const w of S.workouts){
    if (w.id === excludeId || (best && w.start <= best.start)) continue;
    const en = w.entries.find(e => e.exId === exId);
    if (en && en.sets.some(s => s.r > 0)) best = {start: w.start, sets: en.sets.filter(s => s.r > 0)};
  }
  return best ? best.sets : [];
}

/* Walk all finished workouts chronologically; build per-exercise sessions, bests, rep maxes and PR events. */
function records(){
  if (recCache) return recCache;
  const byEx = {}, tags = {};
  const ws = [...S.workouts].sort((a, b) => a.start - b.start);
  for (const w of ws){
    w.entries.forEach((en, ei) => {
      const x = ex(en.exId); if (!x) return;
      const R = byEx[en.exId] || (byEx[en.exId] = {best:{w:0, e1:0, reps:0}, rep:{}, events:[], sessions:[]});
      const s = {wid:w.id, t:w.start, maxW:0, e1:0, vol:0, maxR:0, totR:0, n:0, topW:0, topR:0, wi:-1, ei:-1, ri:-1};
      en.sets.forEach((st, si) => {
        if (st.warm || !(st.r > 0)) return;
        const wt = st.w > 0 ? st.w : 0;
        s.n++; s.totR += st.r; s.vol += wt * st.r;
        if (st.r > s.maxR){ s.maxR = st.r; s.ri = si; }
        if (wt > s.maxW){ s.maxW = wt; s.wi = si; }
        const e = e1rm(wt, st.r);
        if (e > s.e1){ s.e1 = e; s.ei = si; s.topW = wt; s.topR = st.r; }
        if (wt > 0) for (const k of REPS) if (st.r >= k && (!R.rep[k] || wt > R.rep[k].w)) R.rep[k] = {w:wt, r:st.r, t:w.start};
      });
      if (!s.n) return;
      const had = R.sessions.length > 0;
      const tag = (si, type) => { const k = `${w.id}:${ei}:${si}`; (tags[k] || (tags[k] = [])).push(type); };
      if (x.type === 'reps'){
        if (had && s.maxR > R.best.reps){ R.events.push({t:w.start, type:'Reps', val:s.maxR, w:false}); tag(s.ri, 'Reps'); }
      } else {
        if (had && s.maxW > R.best.w + 0.001){ R.events.push({t:w.start, type:'Weight', val:s.maxW, w:true}); tag(s.wi, 'Weight'); }
        if (had && s.e1 > R.best.e1 + 0.01){ R.events.push({t:w.start, type:'1RM', val:s.e1, w:true}); tag(s.ei, '1RM'); }
      }
      R.best.w = Math.max(R.best.w, s.maxW); R.best.e1 = Math.max(R.best.e1, s.e1); R.best.reps = Math.max(R.best.reps, s.maxR);
      R.sessions.push(s);
    });
  }
  return (recCache = {byEx, tags});
}
function livePR(en, st){
  if (!st.done || st.warm || !(st.r > 0)) return false;
  const R = records().byEx[en.exId]; if (!R || !R.sessions.length) return false;
  const x = ex(en.exId);
  if (x && x.type === 'reps') return st.r > R.best.reps;
  const w = st.w > 0 ? st.w : 0;
  return w > R.best.w + 0.001 || e1rm(w, st.r) > R.best.e1 + 0.01;
}

/* ============ rendering ============ */
const view = $('#view');
let tab = 'log';
const prog = {exId:null, metric:'e1', range:'6M'};
const openW = new Set();
let exQuery = '', showArch = false, chartState = null;

/* ============ motion ============
   Every action re-renders the view from state.  To keep that smooth, render() measures each
   element carrying a data-k key before and after, then animates the difference (FLIP):
   moved elements glide, resized cards grow or shrink, new elements fade up. */
const EASE = 'cubic-bezier(.22,1,.36,1)', SPRING = 'cubic-bezier(.32,.72,0,1)';
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const TABS = ['log', 'history', 'progress', 'exercises'];
function snap(root){
  const m = new Map(); if (reduce.matches || !root) return m;
  root.querySelectorAll('[data-k]').forEach(el => { const r = el.getBoundingClientRect(); m.set(el.dataset.k, {x:r.left + scrollX, y:r.top + scrollY, h:r.height}); });
  return m;
}
function flip(root, first){
  if (reduce.matches || !first || !first.size) return;
  const els = [...root.querySelectorAll('[data-k]')], now = new Map();
  els.forEach(el => { const r = el.getBoundingClientRect(); now.set(el, {x:r.left + scrollX, y:r.top + scrollY, h:r.height}); });
  let entering = 0;
  els.forEach(el => {
    const a = first.get(el.dataset.k), b = now.get(el);
    const par = el.parentElement && el.parentElement.closest('[data-k]');
    const parIn = par && root.contains(par);
    if (!a){
      if (parIn && !first.has(par.dataset.k)) return;          // parent is entering and carries it
      el.animate([{opacity:0, transform:'translateY(10px) scale(.98)'}, {opacity:1, transform:'none'}],
        {duration:380, easing:EASE, delay:Math.min(entering++, 8) * 35, fill:'backwards'});
      return;
    }
    let dx = a.x - b.x, dy = a.y - b.y;
    if (parIn){ const pa = first.get(par.dataset.k), pb = now.get(par); if (pa){ dx -= pa.x - pb.x; dy -= pa.y - pb.y; } }
    const grow = el.classList.contains('card') && Math.abs(a.h - b.h) > 1;
    if (Math.abs(dx) < .5 && Math.abs(dy) < .5 && !grow) return;
    const k0 = {transform:`translate(${dx}px,${dy}px)`}, k1 = {transform:'none'};
    if (grow){ k0.height = a.h + 'px'; k1.height = b.h + 'px'; el.style.overflow = 'hidden'; }
    const an = el.animate([k0, k1], {duration:420, easing:EASE});
    if (grow) an.onfinish = an.oncancel = () => { el.style.overflow = ''; };
  });
}
function animateOut(el){
  if (!el || reduce.matches) return Promise.resolve();
  const cs = getComputedStyle(el), h = el.getBoundingClientRect().height;
  el.style.overflow = 'hidden'; el.style.pointerEvents = 'none';
  return el.animate([
    {opacity:1, height:h + 'px', marginTop:cs.marginTop, marginBottom:cs.marginBottom, paddingTop:cs.paddingTop, paddingBottom:cs.paddingBottom, transform:'none'},
    {opacity:0, height:'0px', marginTop:'0px', marginBottom:'0px', paddingTop:'0px', paddingBottom:'0px', transform:'scale(.96)'}
  ], {duration:280, easing:EASE, fill:'forwards'}).finished.catch(() => {});
}
function pop(el, big){
  if (!el || reduce.matches) return;
  el.animate(big ? [{transform:'scale(0) rotate(-20deg)'}, {transform:'scale(1.35) rotate(6deg)', offset:.6}, {transform:'none'}]
                 : [{transform:'scale(.7)'}, {transform:'scale(1.15)', offset:.55}, {transform:'none'}], {duration:big ? 620 : 420, easing:EASE});
}
function revealEntry(id){
  const el = view.querySelector(`[data-k="${id}"]`); if (!el) return;
  const r = el.getBoundingClientRect();
  if (r.bottom > innerHeight - 90 || r.top < 60) window.scrollTo({top:Math.max(0, scrollY + r.top - 80), behavior:reduce.matches ? 'auto' : 'smooth'});
}

let shownTab = null;
function render(){
  const switching = shownTab !== tab, from = shownTab;
  const first = switching ? null : snap(view);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#tabind').style.transform = `translateX(${TABS.indexOf(tab) * 100}%)`;
  ({log:renderLog, history:renderHistory, progress:renderProgress, exercises:renderExercises})[tab]();
  shownTab = tab;
  if (!switching){ flip(view, first); return; }
  if (reduce.matches) return;
  const dir = from === null ? 0 : Math.sign(TABS.indexOf(tab) - TABS.indexOf(from));
  view.animate([{opacity:0, transform:dir ? `translateX(${dir * 28}px)` : 'translateY(10px)'}, {opacity:1, transform:'none'}], {duration:360, easing:EASE});
  const icon = document.querySelector(`#tabs button[data-tab="${tab}"] svg`);
  if (icon && from !== null) icon.animate([{transform:'scale(1)'}, {transform:'scale(1.25) translateY(-2px)', offset:.4}, {transform:'scale(1)'}], {duration:450, easing:EASE});
}

function entryCard(en, ei){

    const p = prev[si];

function renderProgress(){

  const x = ex(prog.exId), R = rec.byEx[x.id], isR = x.type === 'reps';
  const M = isR ? [['maxR','Best set','r'], ['totR','Total reps','r']] : [['e1','Est. 1RM','w'], ['maxW','Heaviest set','w'], ['vol','Volume','w']];
  if (!M.some(m => m[0] === prog.metric)) prog.metric = M[0][0];

  const priorMax = prior.length ? Math.max(...prior) : -Infinity;
  const allBest = Math.max(...R.sessions.map(val));
  const first = pts[0], last = pts[pts.length - 1];
  const chg = pts.length > 1 && first.y > 0 ? (last.y - first.y) / first.y * 100 : null;

  let h = `<div class="card" data-k="pc1">

    <div class="chips">${M.map(mm => `<button class="chip ${mm[0] === prog.metric ? 'on' : ''}" data-a="metric" data-m="${mm[0]}">${mm[1]}</button>`).join('')}</div>
    <div class="stats four">

      <div class="stat"><div class="k">All-time best</div><div class="v">${fmtV(allBest)}</div></div>
      <div class="stat"><div class="k">Change</div><div class="v">${chgHtml}</div></div>
      <div class="stat"><div class="k">Sessions</div><div class="v">${pts.length}</div></div>
    </div>
    ${pts.length ? chartSVG(pts, priorMax, fmtV, !isR) : '<div class="empty-sm mut">No sessions in this range.</div>'}
    <div class="chips range">${RANGES.map(r => `<button class="chip ${r[0] === prog.range ? 'on' : ''}" data-a="range" data-r="${r[0]}">${r[0]}</button>`).join('')}</div>
    <p class="mut xs center" style="margin:10px 0 0">Gold dots mark a new all-time high. Tap or drag across the chart for details.</p>
  </div>`;

  if (!isR){
    const rows = REPS.filter(k => R.rep[k]).map(k => `<tr><td>${k}+</td><td class="num">${fmtW(R.rep[k].w)}</td><td class="num mut">${R.rep[k].r}</td><td class="num mut">${shortDate(R.rep[k].t)}</td></tr>`).join('');
    if (rows) h += `<h3 class="sec" data-k="pc2h">Rep maxes</h3><div class="card" data-k="pc2"><table><thead><tr><th>Reps</th><th class="num">Best (${unit()})</th><th class="num">Did</th><th class="num">Date</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="mut xs" style="margin:8px 0 0">Heaviest weight lifted for at least that many reps.</p></div>`;
  }
  const ev = [...R.events].reverse().slice(0, 15);
  h += `<h3 class="sec" data-k="pc3h">PR history</h3><div class="card" data-k="pc3">${ev.length
    ? `<table><tbody>${ev.map(e => `<tr><td>${PR_LABEL[e.type]}</td><td class="num"><b>${e.w ? `${fmtW(e.val)} ${unit()}` : `${e.val} reps`}</b></td><td class="num mut">${shortDate(e.t)}</td></tr>`).join('')}</tbody></table>`
    : '<p class="mut sm" style="margin:0">No PRs yet. Your first session sets the baseline.</p>'}</div>`;
  view.innerHTML = h;
  bindChart();
}

function niceTicks(lo, hi, n){
  const span = hi - lo || 1, raw = span / (n - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const start = Math.max(0, Math.floor(lo / step) * step), end = Math.ceil(hi / step) * step;
  const t = []; for (let v = start; v <= end + step / 2; v += step) t.push(+v.toFixed(6));
  if (t.length < 2) t.push(+(start + step).toFixed(6));
  return t;
}
function fmtAxis(v){ if (v >= 10000) return (v / 1000).toFixed(v >= 100000 ? 0 : 1).replace(/\.0$/, '') + 'k'; return String(r1(v)); }
function axDate(t, span){ return new Date(t).toLocaleDateString(undefined, span > 330 * 86400000 ? {month:'short', year:'2-digit'} : {month:'short', day:'numeric'}); }

function chartSVG(pts, priorMax, fmtY, weighted){
  const W = 640, H = 300, L = 58, Rm = 16, T = 40, B = 34;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x1 - x0 < 86400000){ x0 -= 3 * 86400000; x1 += 3 * 86400000; }
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 1e-9){ lo = lo * 0.9; hi = hi * 1.1 || 1; } else { const p = (hi - lo) * 0.08; lo -= p; hi += p; }
  const ticks = niceTicks(Math.max(0, lo), hi, 5), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - Rm), sy = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (const t of ticks){ const y = sy(t).toFixed(1); g += `<line x1="${L}" x2="${W - Rm}" y1="${y}" y2="${y}" class="grid"/><text x="${L - 8}" y="${(+y + 6).toFixed(1)}" class="ax" text-anchor="end">${fmtAxis(t)}</text>`; }
  for (let i = 0; i <= 3; i++){ const t = x0 + (x1 - x0) * i / 3; g += `<text x="${sx(t).toFixed(1)}" y="${H - 8}" class="ax" text-anchor="${i === 0 ? 'start' : i === 3 ? 'end' : 'middle'}">${axDate(t, x1 - x0)}</text>`; }
  const P = pts.map(p => [sx(p.x), sy(p.y)]);
  const line = P.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const base = sy(y0).toFixed(1);
  const area = P.length > 1 ? `${line} L${P[P.length - 1][0].toFixed(1)} ${base} L${P[0][0].toFixed(1)} ${base} Z` : '';
  let mx = priorMax, dots = '';
  pts.forEach((p, i) => { const pr = mx > -Infinity && p.y > mx + 1e-9; if (p.y > mx) mx = p.y;
    const d = (.1 + .85 * (P[i][0] - L) / (W - L - Rm)).toFixed(2);
    dots += `<circle cx="${P[i][0].toFixed(1)}" cy="${P[i][1].toFixed(1)}" r="${pr ? 6 : 4}" class="dot${pr ? ' pr' : ''}" style="--d:${d}s"/>`; });
  chartState = {pts, P, W, fmtY, weighted};
  return `<div class="chartwrap"><div class="tip" id="tip"></div>
    <svg id="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">
      <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></linearGradient></defs>
      ${g}${area ? `<path d="${area}" class="area" fill="url(#ag)"/>` : ''}<path d="${line}" class="ln" pathLength="1"/>${dots}
      <line id="xh" class="xh" y1="${T}" y2="${H - B}" x1="0" x2="0"/><circle id="hl" r="8" cx="0" cy="0" class="hl"/>
    </svg></div>`;
}
function bindChart(){
  const svg = $('#chart'); if (!svg || !chartState) return;
  const show = e => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * chartState.W;
    let bi = 0, bd = Infinity;
    chartState.P.forEach((p, i) => { const d = Math.abs(p[0] - vx); if (d < bd){ bd = d; bi = i; } });
    const [px, py] = chartState.P[bi], p = chartState.pts[bi];
    const xh = $('#xh'), hl = $('#hl'), tip = $('#tip');
    xh.style.transform = `translateX(${px}px)`; hl.style.transform = `translate(${px}px,${py}px)`; svg.classList.add('hover');
    const top = chartState.weighted && p.s.topW ? `<br><span class="mut">Top set ${fmtW(p.s.topW)} × ${p.s.topR}</span>` : '';
    tip.innerHTML = `<b>${chartState.fmtY(p.y)}</b> · ${shortDate(p.x)}${top}`;
    tip.hidden = false; tip.classList.add('on');
    tip.style.left = Math.min(82, Math.max(18, px / chartState.W * 100)) + '%';
  };
  svg.addEventListener('pointermove', show);

/* ============ modals ============ */
let mClose = null, drag = null;
function modal(html){
  const m = $('#modal'), sh = $('#sheet');
  const wasOpen = !m.hidden;                                       // includes a sheet mid-exit: swap content instead
  if (mClose){ clearTimeout(mClose.t); mClose.anims.forEach(a => a.cancel()); mClose = null; }
  const h0 = wasOpen ? sh.getBoundingClientRect().height : 0;
  sh.innerHTML = '<div class="grab" data-grab></div>' + html;
  sh.style.transform = ''; m.style.backgroundColor = ''; m.style.pointerEvents = '';
  m.hidden = false; sh.scrollTop = 0;
  if (reduce.matches) return;
  const kids = [...sh.children].slice(1);
  if (wasOpen){
    const h1 = sh.getBoundingClientRect().height;
    if (Math.abs(h1 - h0) > 1) sh.animate([{height:h0 + 'px'}, {height:h1 + 'px'}], {duration:380, easing:SPRING});
    kids.forEach((k, i) => k.animate([{opacity:0, transform:'translateY(6px)'}, {opacity:1, transform:'none'}], {duration:260, easing:EASE, delay:Math.min(i, 6) * 25, fill:'backwards'}));
  } else {
    m.animate([{backgroundColor:'rgba(0,0,0,0)'}, {backgroundColor:'rgba(0,0,0,.6)'}], {duration:320, easing:'ease-out'});
    sh.animate([{transform:'translateY(100%)'}, {transform:'none'}], {duration:520, easing:SPRING});
    kids.forEach((k, i) => k.animate([{opacity:0, transform:'translateY(14px)'}, {opacity:1, transform:'none'}], {duration:420, easing:EASE, delay:80 + Math.min(i, 6) * 35, fill:'backwards'}));
  }
}
function closeModal(){
  const m = $('#modal'), sh = $('#sheet');
  if (m.hidden || mClose) return;
  const done = () => { m.hidden = true; sh.innerHTML = ''; sh.style.transform = ''; m.style.backgroundColor = ''; m.style.pointerEvents = ''; mClose = null; };
  if (reduce.matches){ done(); return; }
  m.style.pointerEvents = 'none';                                  // never swallow taps during the exit
  const t0 = getComputedStyle(sh).transform, bg0 = getComputedStyle(m).backgroundColor;
  const a1 = sh.animate([{transform:t0 === 'none' ? 'none' : t0}, {transform:'translateY(100%)'}], {duration:300, easing:'cubic-bezier(.4,0,.9,.6)', fill:'forwards'});
  const a2 = m.animate([{backgroundColor:bg0}, {backgroundColor:'rgba(0,0,0,0)'}], {duration:300, easing:'ease-in', fill:'forwards'});
  mClose = {anims:[a1, a2], t:setTimeout(() => { a1.cancel(); a2.cancel(); done(); }, 300)};
}
(() => {
  const sh = $('#sheet'), m = $('#modal');
  sh.addEventListener('pointerdown', e => {
    if (!e.target.closest('[data-grab]') || mClose) return;
    drag = {y0:e.clientY, y:e.clientY, t:performance.now(), v:0, dy:0};
    sh.setPointerCapture(e.pointerId);
  });
  sh.addEventListener('pointermove', e => {
    if (!drag) return;
    const now = performance.now(), raw = e.clientY - drag.y0;
    drag.v = (e.clientY - drag.y) / Math.max(1, now - drag.t); drag.y = e.clientY; drag.t = now;
    drag.dy = raw < 0 ? raw * .2 : raw;                              // rubber-band upward
    sh.style.transform = `translateY(${drag.dy}px)`;
    m.style.backgroundColor = `rgba(0,0,0,${(.6 * (1 - Math.min(1, Math.max(0, drag.dy) / 500))).toFixed(3)})`;
  });
  const end = () => {
    if (!drag) return;
    const {dy, v} = drag; drag = null;
    if (dy > 110 || v > .55){ closeModal(); return; }
    sh.animate([{transform:`translateY(${dy}px)`}, {transform:'none'}], {duration:420, easing:SPRING});
    sh.style.transform = ''; m.style.backgroundColor = '';
  };
  sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);
})();

function finishFlow(){

  if (unchecked){

  }
  commitWorkout('checked');
}
function commitWorkout(mode){
  const a = S.active;
  const entries = a.entries.map(en => ({exId:en.exId, sets:en.sets.filter(s => s.r > 0 && (s.done || mode === 'all'))
    .map(s => ({w: s.w > 0 ? Math.round(s.w * 100) / 100 : null, r: Math.round(s.r), warm: !!s.warm}))})).filter(en => en.sets.length);
  const orig = a.editingId && S.workouts.find(w => w.id === a.editingId);
  const end = a.manual ? a.start + Math.max(1, +a.dur || 60) * 60000 : orig ? a.start + (orig.end - orig.start) : Date.now();
  const w = {id: a.editingId || a.id, start: a.start, end, name: (a.name || 'Workout').trim() || 'Workout', entries};
  if (orig) S.workouts[S.workouts.indexOf(orig)] = w; else S.workouts.push(w);
  S.active = null; hideRest();
  save(); closeModal(); render(); showSummary(w);
}

    const [wid, ei] = k.split(':');
    if (wid === w.id){ const x = ex(w.entries[+ei].exId); types.forEach(t => prs.push(`${esc(x?.name)}: ${PR_LABEL[t]}`)); }

    ${prs.length ? `<h3 class="sec gold">🏆 ${prs.length} PR${prs.length > 1 ? 's' : ''}</h3><div class="list">${prs.map(p => `<div class="li">${p}</div>`).join('')}</div>` : ''}
    <div class="stack"><button class="btn primary" data-a="close">Done</button></div>`);

/* ============ rest timer ============ */
let restEnd = 0, restTotal = 0, restDoneAt = 0, actx = null;
function unlockAudio(){ try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function startRest(sec){ restTotal = sec; restEnd = Date.now() + sec * 1000; restDoneAt = 0; const b = $('#restbar'); b.classList.remove('fin'); b.classList.add('show'); }
function hideRest(){ restEnd = 0; restDoneAt = 0; $('#restbar').classList.remove('show'); }
function alertDone(){
  try { navigator.vibrate && navigator.vibrate([250, 120, 250]); } catch (e) {}
  if (!actx) return;
  try { [0, 0.3].forEach(off => { const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + off;
    o.frequency.value = 880; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.22); }); } catch (e) {}
}
setInterval(() => {
  const el = $('#elapsed'); if (el && S.active && !S.active.manual) el.textContent = fmtClock(Date.now() - S.active.start);
  const bar = $('#restbar');
  if (restEnd){
    const ms = restEnd - Date.now();
    if (ms <= 0){ restEnd = 0; restDoneAt = Date.now(); $('#resttime').textContent = 'Rest done'; $('#restfill').style.transform = 'scaleX(1)'; bar.classList.add('fin'); alertDone();
      if (!reduce.matches) bar.animate([{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}], {duration:500, easing:'cubic-bezier(.22,1,.36,1)'}); }
    else { $('#resttime').textContent = fmtClock(ms, true); $('#restfill').style.transform = `scaleX(${Math.min(1, 1 - ms / (restTotal * 1000)).toFixed(4)})`; }
  } else if (restDoneAt && Date.now() - restDoneAt > 5000){ hideRest(); }
}, 250);

/* ============ import / export ============ */
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const ymd = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function csvCell(v){ v = String(v ?? ''); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }
function exportCSV(){
  const u = unit(), rows = [['date','workout','exercise','muscle_group','set','set_type',`weight_${u}`,'reps',`est_1rm_${u}`]];
  for (const w of [...S.workouts].sort((a, b) => a.start - b.start)) for (const en of w.entries){
    const x = ex(en.exId); let n = 0;
    en.sets.forEach(s => rows.push([toLocalInput(w.start).replace('T', ' '), w.name, x?.name || '', x?.group || '', s.warm ? 'W' : ++n, s.warm ? 'warmup' : 'working',
      s.w > 0 ? fmtW(s.w) : '', s.r, x?.type === 'reps' || !(s.w > 0) ? '' : fmtW(e1rm(s.w, s.r))]));
  }
  download(`ironbook-sets-${ymd()}.csv`, rows.map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv');
}
function importFile(f){
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.exercises) || !Array.isArray(d.workouts)) throw new Error('bad');
      if (!confirm(`Replace all data on this device with this backup (${d.workouts.length} workouts)?`)) return;
      S = normalize(d); save(); closeModal(); render(); toast('Backup restored');
    } catch (e) { toast("That file isn't an Ironbook backup"); }
  };
  rd.readAsText(f);
}

/* ============ actions ============ */
const act = () => S.active;
const setAt = b => act().entries[+b.dataset.e].sets[+b.dataset.s];
const A = {
  tab: b => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); },
  settings: () => openSettings(),
  close: () => closeModal(),
  start: () => { S.active = newWorkout(); save(); render(); },
  repeat: b => {
    const w = S.workouts.find(x => x.id === b.dataset.id); if (!w) return;
    if (S.active){ toast('Finish or discard the current workout first'); return; }
    S.active = newWorkout(w.name);
    S.active.entries = w.entries.map(en => ({id:uid(), exId:en.exId, sets:en.sets.map(s => newSet({w:s.w, r:s.r, warm:!!s.warm}))}));
    save(); tab = 'log'; render(); window.scrollTo(0, 0);
  },
  pick: () => openPicker(),
  pickex: b => {
    const id = b.dataset.id, prev = lastSets(id, act().editingId);
    const sets = prev.length ? prev.slice(0, 10).map(p => newSet({warm:!!p.warm})) : [newSet()];
    const en = {id:uid(), exId:id, sets};
    act().entries.push(en); save(); closeModal(); render(); revealEntry(en.id);
  },
  addset: b => { const en = act().entries[+b.dataset.e], l = en.sets[en.sets.length - 1];
    en.sets.push(newSet({w: l ? l.w : null, r: l ? l.r : null})); save(); render(); },
  done: b => {
    unlockAudio();
    const en = act().entries[+b.dataset.e], st = setAt(b);
    if (!st.done){
      if (!(st.r > 0)){
        const p = lastSets(en.exId, act().editingId)[+b.dataset.s];
        if (p){ if (st.w == null) st.w = p.w; st.r = p.r; } else { toast('Enter reps first'); return; }
      }
      st.done = true; startRest(S.settings.rest);
      try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
    } else st.done = false;
    save(); render();
    const row = view.querySelector(`[data-k="${st.id}"]`);
    if (row && st.done && !reduce.matches){
      pop(row.querySelector('.chk'));
      const tag = row.querySelector('.prtag');
      if (tag.textContent){ pop(tag, true); row.animate([{boxShadow:'0 0 0 0 rgba(255,200,61,.65)'}, {boxShadow:'0 0 0 12px rgba(255,200,61,0)'}], {duration:900, easing:EASE}); }
    }
  },
  fillprev: b => { const en = act().entries[+b.dataset.e], p = lastSets(en.exId, act().editingId)[+b.dataset.s]; if (!p) return;
    const st = setAt(b); st.w = p.w; st.r = p.r; save(); render(); },
  setmenu: b => { const st = setAt(b), e = b.dataset.e, s = b.dataset.s;
    modal(`<h2>Set options</h2><div class="stack"><button class="btn" data-a="warm" data-e="${e}" data-s="${s}">${st.warm ? 'Mark as working set' : 'Mark as warm-up'}</button>
      <button class="btn ghost danger" data-a="delset" data-e="${e}" data-s="${s}">Delete set</button><button class="btn ghost" data-a="close">Cancel</button></div>`); },
  warm: b => { const st = setAt(b); st.warm = !st.warm; save(); closeModal(); render(); },
  delset: async b => { const en = act().entries[+b.dataset.e], st = setAt(b); closeModal();
    await animateOut(view.querySelector(`[data-k="${st.id}"]`)); en.sets.splice(en.sets.indexOf(st), 1); save(); render(); },
  exmenu: b => { const ei = +b.dataset.e, en = act().entries[ei], n = act().entries.length;
    modal(`<h2>${esc(ex(en.exId)?.name || '')}</h2><div class="stack">
      <button class="btn" data-a="goprog" data-id="${en.exId}">View progress</button>
      ${ei > 0 ? `<button class="btn" data-a="move" data-e="${ei}" data-d="-1">Move up</button>` : ''}
      ${ei < n - 1 ? `<button class="btn" data-a="move" data-e="${ei}" data-d="1">Move down</button>` : ''}
      <button class="btn ghost danger" data-a="rmentry" data-e="${ei}">Remove exercise</button>
      <button class="btn ghost" data-a="close">Cancel</button></div>`); },
  move: b => { const e = act().entries, i = +b.dataset.e, j = i + +b.dataset.d; [e[i], e[j]] = [e[j], e[i]]; save(); closeModal(); render(); },
  rmentry: async b => { const en = act().entries[+b.dataset.e]; closeModal();
    await animateOut(view.querySelector(`[data-k="${en.id}"]`)); act().entries.splice(act().entries.indexOf(en), 1); save(); render(); },
  goprog: b => { closeModal(); prog.exId = b.dataset.id; tab = 'progress'; render(); window.scrollTo(0, 0); },
  cancel: () => { if (confirm(act().editingId ? 'Discard your changes to this workout?' : 'Discard this workout? Nothing will be saved.')){ S.active = null; hideRest(); save(); render(); } },
  finish: () => finishFlow(),
  fin: b => commitWorkout(b.dataset.m),
  rest: b => { const d = b.dataset.d; if (d === 'skip' || !restEnd){ hideRest(); return; }
    restEnd = Math.max(Date.now() + 1000, restEnd + +d * 1000); restTotal = Math.max(1, restTotal + +d); },
  toggleW: b => { const id = b.dataset.id; openW.has(id) ? openW.delete(id) : openW.add(id); render(); },
  delW: async b => { if (!confirm('Delete this workout permanently?')) return; const id = b.dataset.id;
    await animateOut(view.querySelector(`[data-k="${id}"]`)); S.workouts = S.workouts.filter(w => w.id !== id); openW.delete(id); save(); render(); },
  editW: b => {
    if (S.active){ toast('Finish or discard the current workout first'); return; }
    const w = S.workouts.find(x => x.id === b.dataset.id); if (!w) return;
    S.active = {id:w.id, editingId:w.id, start:w.start, name:w.name, dur:Math.round((w.end - w.start) / 60000),
      entries: w.entries.map(en => ({id:uid(), exId:en.exId, sets:en.sets.map(s => newSet({w:s.w, r:s.r, warm:!!s.warm, done:true}))}))};
    save(); tab = 'log'; render(); window.scrollTo(0, 0);
  },
  metric: b => { prog.metric = b.dataset.m; render(); },
  range: b => { prog.range = b.dataset.r; render(); },
  newEx: b => exForm({name: b.dataset.name || '', group: 'Other', type: 'weighted'}, true, b.dataset.ctx || ''),
  editEx: b => { const x = ex(b.dataset.id); if (x) exForm(x, false, ''); },
  saveEx: b => {
    const name = $('#exName').value.trim().replace(/\s+/g, ' '), group = $('#exGroup').value, type = $('#exType').value, id = b.dataset.id;
    if (!name){ toast('Give it a name'); return; }
    if (S.exercises.some(x => x.id !== id && x.name.toLowerCase() === name.toLowerCase())){ toast('An exercise with that name already exists'); return; }
    let newId = null;
    if (id){ Object.assign(ex(id), {name, group, type}); }
    else {
      const x = {id:uid(), name, group, type, archived:false}; S.exercises.push(x);
      if (b.dataset.ctx === 'picker' && S.active){ newId = uid(); S.active.entries.push({id:newId, exId:x.id, sets:[newSet()]}); }
    }
    save(); closeModal(); render(); if (newId) revealEntry(newId);
  },
  archEx: b => { const x = ex(b.dataset.id); x.archived = !x.archived; save(); closeModal(); render(); },
  delEx: b => { if (!confirm('Delete this exercise?')) return; S.exercises = S.exercises.filter(x => x.id !== b.dataset.id); save(); closeModal(); render(); },
  toggleArch: b => { showArch = b.checked; renderExList(true); },
  unit: b => { S.settings.unit = b.dataset.u; save(); openSettings(); render(); },
  exportJSON: () => download(`ironbook-backup-${ymd()}.json`, JSON.stringify(S), 'application/json'),
  exportCSV: () => exportCSV(),
  wipe: () => { if (!confirm('Erase all workouts and exercises on this device? Export a backup first if unsure.')) return; S = fresh(); save(); closeModal(); tab = 'log'; render(); toast('All data erased'); },
};

document.addEventListener('click', e => {
  if (e.target.id === 'modal'){ closeModal(); return; }
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const f = A[b.dataset.a]; if (f) f(b, e);
});
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  if (f === 'w' || f === 'r'){
    const st = setAt(t), v = parseFloat(t.value);
    if (f === 'w') st.w = isFinite(v) && v >= 0 ? fromD(v) : null;
    else st.r = isFinite(v) && v >= 0 ? Math.round(v) : null;
    updatePR(+t.dataset.e, +t.dataset.s); saveSoon();
  }
  else if (f === 'name'){ act().name = t.value; saveSoon(); }
  else if (f === 'dur'){ act().dur = parseInt(t.value, 10) || 60; saveSoon(); }
  else if (f === 'exq'){ exQuery = t.value; renderExList(true); }
  else if (f === 'pq'){ renderPick(t.value, true); }
});
document.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  if (f === 'start'){ const v = new Date(t.value).getTime(); if (isFinite(v)){ const a = act(); a.start = v; a.manual = true; a.dur = a.dur || 60; save(); render(); } }
  else if (f === 'progEx'){ prog.exId = t.value; render(); }
  else if (f === 'formula'){ S.settings.formula = t.value; save(); }
  else if (f === 'rest'){ S.settings.rest = +t.value; save(); }
  else if (f === 'import'){ importFile(t.files[0]); }
});

render();
</script>
</body>
</html>
